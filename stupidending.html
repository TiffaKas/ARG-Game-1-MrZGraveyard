<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TERMINATED - 系统强制终止</title>
    <style>
        :root {
            --glitch-red: rgba(255, 0, 193, 0.3); /* 降低透明度，减少刺眼感 */
            --glitch-blue: rgba(0, 255, 249, 0.3);
            --bg-color: #050505;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* 动态背景：数据流 */
        #data-stream {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.15;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        /* 修改后的 ACCESS DENIED 样式 */
        .glitch {
            font-size: 2.5rem;
            font-weight: bold;
            position: relative;
            /* 基础动画：原地轻微浮动 */
            animation: float 3s ease-in-out infinite;
            transition: all 0.1s steps(2); /* 让位移看起来更像电子故障 */
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 2px 2px var(--glitch-red), -2px -2px var(--glitch-blue);
        }

        /* 原地浮动动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .description {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #888;
            letter-spacing: 2px;
            max-width: 600px;
            line-height: 1.6;
        }

        .reset-section {
            margin-top: 60px;
            opacity: 0;
            animation: fadeIn 2s forwards 2s;
        }

        .btn-reset {
            background: none;
            border: 1px solid #fff;
            color: #fff;
            padding: 15px 30px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-reset:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 极轻微的扫描线感 */
        #noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="noise"></div>
    <canvas id="data-stream"></canvas>

    <div class="container">
        <div class="glitch" id="main-title">ACCESS DENIED</div>
        
        <div class="description">
            总部的人和警察来到了你的房间。<br>
            你的工号已被注销，权限已封锁。<br>
            <span style="color: #ff0044; font-weight: bold;">你被解雇了......</span>
        </div>

        <div class="reset-section">
            <p style="font-size: 10px; margin-bottom: 20px; color: #444;">正在清除本地身份缓存 (CLEARING COOKIES...)</p>
            <button class="btn-reset" onclick="resetGame()">清除数据，重新玩一遍吧</button>
        </div>
    </div>

    <script>
        // 1. 标题随机跳变逻辑
        const title = document.getElementById('main-title');
        const originalParent = title.parentElement;
        
        function glitchJump() {
            // 保存原始样式以便恢复
            const originalStyle = title.style.cssText;
            
            // 随机生成屏幕中上部位置
            const randomX = Math.random() * 60 - 30; // -30vw 到 30vw
            const randomY = Math.random() * -30 - 10; // 屏幕上方移动
            
            // 瞬间闪变
            title.style.position = 'relative';
            title.style.transform = `translate(${randomX}vw, ${randomY}vh) scale(${0.9 + Math.random() * 0.2})`;
            title.style.opacity = "0.7";
            
            // 0.5秒后回到原位继续浮动
            setTimeout(() => {
                title.style.cssText = "";
                title.style.animation = "float 3s ease-in-out infinite";
            }, 500);
        }

        // 每 2 秒执行一次跳变
        setInterval(glitchJump, 2000);

        // 2. 背景数据流
        const canvas = document.getElementById('data-stream');
        const ctx = canvas.getContext('2d');
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        const letters = "01010101HIDDENERROR777";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(5, 5, 5, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0"; 
            ctx.font = fontSize + "px Courier New";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // 3. 重置游戏逻辑：清除 Cookie 并返回 index.html
        function resetGame() {
            // 清除 LocalStorage
            localStorage.clear();
            
            // 清除 SessionStorage
            sessionStorage.clear();

            // 清除所有路径下的 Cookie
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i];
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substr(0, eqPos).trim() : cookie.trim();
                // 尝试在常见路径下删除
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=" + window.location.pathname;
            }

            // 视觉反馈后跳转
            document.body.style.transition = "background 0.5s";
            document.body.style.backgroundColor = "#fff";
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        }
    </script>
</body>
</html>
