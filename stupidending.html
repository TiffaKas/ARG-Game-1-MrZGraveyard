<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TERMINATED - 系统强制终止</title>
    <style>
        :root {
            --glitch-red: #ff00c1;
            --glitch-blue: #00fff9;
            --bg-color: #050505;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* 动态背景：数据流效果 - 提高可见度 */
        #data-stream {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.25; /* 增加不透明度让流动感更清晰 */
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        /* 花屏文字效果 */
        .glitch {
            font-size: 2.5rem;
            font-weight: bold;
            position: relative;
            text-shadow: 0.05em 0 0 var(--glitch-red), -0.05em -0.025em 0 var(--glitch-blue);
            animation: glitch 1s infinite;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.8;
        }

        .glitch::before {
            animation: glitch-anim 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
            left: -2px;
            text-shadow: -2px 0 #ff0044;
        }

        .glitch::after {
            animation: glitch-anim2 3s infinite linear alternate-reverse;
            clip-path: polygon(0 67%, 100% 67%, 100% 100%, 0 100%);
            left: 2px;
            text-shadow: -2px 0 #00ffff;
        }

        .description {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #888;
            letter-spacing: 2px;
            max-width: 600px;
            line-height: 1.6;
        }

        .reset-section {
            margin-top: 60px;
            opacity: 0;
            animation: fadeIn 2s forwards 3s; /* 延迟显示，增加仪式感 */
        }

        .btn-reset {
            background: none;
            border: 1px solid #fff;
            color: #fff;
            padding: 15px 30px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-reset:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        /* 动画定义 */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes glitch-anim {
            0% { clip-path: inset(80% 0 0 0); }
            100% { clip-path: inset(10% 0 40% 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip-path: inset(0 0 70% 0); }
            100% { clip-path: inset(50% 0 10% 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 全屏花屏闪烁效果 */
        #noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/5/5a/Static_noise.gif');
            opacity: 0.05;
            z-index: 2;
            pointer-events: none;
        }

        /* 新增：1秒一次的全屏花屏闪烁层 */
        #screen-glitch-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            animation: screen-flash 1s infinite;
        }

        @keyframes screen-flash {
            0% { opacity: 0; }
            95% { opacity: 0; transform: scale(1); }
            96% { opacity: 0.1; transform: scale(1.02) skewX(5deg); }
            97% { opacity: 0; }
            98% { opacity: 0.05; transform: scale(0.98) skewX(-5deg); }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="noise"></div>
    <div id="screen-glitch-overlay"></div> <canvas id="data-stream"></canvas>

    <div class="container">
        <div class="glitch" data-text="ACCESS DENIED">ACCESS DENIED</div>
        
        <div class="description">
            总部的人和警察来到了你的房间。<br>
            你的工号已被注销，权限已封锁。<br>
            <span style="color: var(--glitch-red);">你被解雇了......</span>
        </div>

        <div class="reset-section">
            <p style="font-size: 10px; margin-bottom: 20px; color: #444;">正在清除本地身份缓存 (CLEARING COOKIES...)</p>
            <button class="btn-reset" onclick="resetGame()">清除数据，重新玩一遍吧</button>
        </div>
    </div>

    <script>
        // 背景数据流效果
        const canvas = document.getElementById('data-stream');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+ｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";
        const fontSize = 16; // 稍微调大字体，增强清晰度
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            // 通过调整 alpha 值（0.1 -> 0.08）让拖尾更长更清晰
            ctx.fillStyle = "rgba(5, 5, 5, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#0F0"; 
            ctx.font = fontSize + "px Courier New";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                // 偶尔绘制白色字符增加“高亮”流动感
                if(Math.random() > 0.98) ctx.fillStyle = "#fff";
                else ctx.fillStyle = "#0F0";

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40); // 稍微放慢帧率，让字符下落更具“阅读感”

        // 重置游戏逻辑
        function resetGame() {
            localStorage.clear();
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i];
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            }
            document.body.style.backgroundColor = "#fff";
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 100);
        }

        // 模拟系统自动清除提示
        console.log("HSD Admin: Evidence suppressed. Subject disconnected.");
    </script>
</body>
</html>
