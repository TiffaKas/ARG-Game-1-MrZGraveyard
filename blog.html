            {

                content: '一切都开始于那个噩梦般的诊断书。在此之前，我们只是两个普通的、为了考研和未来发愁的大学生。在此之后，我们的世界被按下了暂停键，然后切换到了另一个生存模式。很多人劝我放弃，说这种罕见病根本没有结果。但我认为，只要它是由于某种基因逻辑触发的，那就一定存在另一种逻辑可以将其逆转。我开始疯狂地自学分子生物学，试图从海量的论文中拼凑出真相。这不仅仅是为了救宋涵，也是为了在这个荒谬的生命游戏里，夺回属于人类的一点点尊严。这是我博客的第一篇，也是这场远征的第一步。'

        const container = document.getElementById('blogPosts');
        container.innerHTML = posts.map((post, index) => `
            <div class="post" id="post-${index}">
                <div class="post-header" onclick="togglePost(${index})">
                    <span class="post-date">${post.date}</span>
                    <span class="post-title">${post.title}</span>
                </div>
                <div class="post-content">
                    ${post.content}
                    <div class="footer-tag">— 记录于实验室 A-12 窗口</div>
                </div>
            </div>
        `).join('');

        function togglePost(index) {
            const el = document.getElementById(`post-${index}`);
            const isActive = el.classList.contains('active');
            document.querySelectorAll('.post').forEach(p => p.classList.remove('active'));
            if(!isActive) {
                el.classList.add('active');
                setTimeout(() => {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            }
        }
    </script>
