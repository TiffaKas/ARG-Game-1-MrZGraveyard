<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>实时墓位平面图 - 千安公墓管理平台</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; --border: #dcdfe6; --dark: #333; }
        body { margin: 0; font-family: "SimSun", serif; background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }

        /* 侧栏样式 - 保持全局同步 */
        .side { width: 260px; background: var(--p-bg); color: #fff; border-right: 4px solid var(--gold); display: flex; flex-direction: column; flex-shrink: 0; }
        .side-header { padding: 40px 20px; text-align: center; }
        .side-header h1 { color: var(--gold); font-size: 22px; letter-spacing: 4px; margin: 0; border: none; text-decoration: none; }
        
        .nav-menu { margin-top: 20px; flex: 1; overflow-y: auto; }
        .menu-label { padding: 15px 25px 5px; font-size: 11px; color: #555; letter-spacing: 1px; }
        .nav-item { padding: 12px 25px; font-size: 14px; color: var(--gold); cursor: pointer; transition: all 0.3s; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .nav-item:hover { background: rgba(255,255,255,0.1); padding-left: 30px; }
        .nav-item span { margin-right: 15px; font-size: 10px; }

        /* 主体区域 */
        .main { flex: 1; padding: 40px; display: flex; flex-direction: column; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--gold); padding-bottom: 15px; }
        .title { font-size: 24px; color: var(--dark); letter-spacing: 2px; }

        /* 画布容器 */
        .map-container { 
            flex: 1; 
            background: #2a3642; 
            border: 1px solid var(--gold); 
            position: relative; 
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #mapCanvas { background-image: radial-gradient(#3a4a5a 1px, transparent 1px); background-size: 20px 20px; cursor: crosshair; }
        
        .status-panel { 
            position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); 
            color: #00ff00; padding: 15px; font-family: monospace; font-size: 12px;
            border-left: 3px solid #00ff00; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="side">
        <div class="side-header">
            <h1>千安公墓</h1>
            <p style="font-size:10px; color:#555; margin-top:5px;">ADMIN TERMINAL v7.0</p>
        </div>
        <div class="nav-menu">
            <div class="menu-label">内部管理</div>
            <div class="nav-item" onclick="location.href='rules.html'"><span> [00] </span> 员工工作守责</div>
            <div class="nav-item" onclick="location.href='system.html'"><span> [01] </span> 档案检索模块</div>
            <div class="nav-item" onclick="location.href='entry.html'"><span> [02] </span> 数据录入终端</div>
            <div class="nav-item" onclick="location.href='list.html'"><span> [03] </span> 已录入档案库</div>
            <div class="nav-item" onclick="location.href='diagram.html'"><span> [04] </span> 实时墓位平面图</div>
            <div class="nav-item" onclick="location.href='complain.html'"><span> [05] </span> 异常投诉报告</div>
            <div class="nav-item" onclick="location.href='email.html'"><span> [06] </span> 内部行政邮箱</div>

            <div class="menu-label">外部连接</div>
            <div class="nav-item" onclick="location.href='official.html'"><span> - </span> 访问对外官网</div>
            <div class="nav-item" onclick="window.open('https://www.google.com')"><span> - </span> 全网搜索引擎</div>
        </div>
        <div style="padding:20px; font-size:11px; color:#444;">系统状态：稳定<br>© 2026 Q-A Admin</div>
    </div>

    <div class="main">
        <div class="header-bar">
            <div class="title">区域实时动态监控</div>
            <div style="color:var(--gold); font-size:12px;">已加密链路：AES-256</div>
        </div>

        <div class="map-container">
            <canvas id="mapCanvas"></canvas>
            <div class="status-panel">
                > 链路状态: 正常<br>
                > 实时节点: 04<br>
                > 刷新率: 60Hz<br>
                > 数据源: 北斗卫星-QA分支
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        
        // 动态调整画布大小
        function resize() {
            canvas.width = canvas.parentElement.clientWidth - 40;
            canvas.height = canvas.parentElement.clientHeight - 40;
        }
        window.onresize = resize;
        resize();

        // 巡逻员数据：progress 设为随机值以解决“刷新重置”问题
        const patrols = [
            { id: "P-01", progress: Math.random(), speed: 0.0005, color: "#ff4d4f" },
            { id: "P-02", progress: Math.random(), speed: 0.0007, color: "#ff4d4f" },
            { id: "P-03", progress: Math.random(), speed: 0.0004, color: "#ff4d4f" },
            { id: "P-04", progress: Math.random(), speed: 0.0006, color: "#ff4d4f" }
        ];

        // 简化的路径映射函数 (矩形环绕路径)
        function getPos(progress) {
            const margin = 80;
            const w = canvas.width - margin * 2;
            const h = canvas.height - margin * 2;
            const total = (w + h) * 2;
            let d = progress * total;

            if (d < w) return { x: margin + d, y: margin };
            d -= w;
            if (d < h) return { x: margin + w, y: margin + d };
            d -= h;
            if (d < w) return { x: margin + w - d, y: margin + h };
            d -= w;
            return { x: margin, y: margin + h - d };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制墓区网格背景简图
            ctx.strokeStyle = "rgba(184, 151, 126, 0.2)";
            ctx.lineWidth = 1;
            for(let i=0; i<5; i++) {
                ctx.strokeRect(100 + i*120, 100, 80, 200);
                ctx.strokeRect(100 + i*120, 350, 80, 200);
            }

            // 更新并绘制巡逻点
            patrols.forEach(p => {
                p.progress = (p.progress + p.speed) % 1;
                const pos = getPos(p.progress);

                // 绘制光晕
                ctx.beginPath();
                const grad = ctx.createRadialGradient(pos.x, pos.y, 2, pos.x, pos.y, 15);
                grad.addColorStop(0, p.color);
                grad.addColorStop(1, "transparent");
                ctx.fillStyle = grad;
                ctx.arc(pos.x, pos.y, 15, 0, Math.PI*2);
                ctx.fill();

                // 绘制核心点
                ctx.beginPath();
                ctx.fillStyle = p.color;
                ctx.arc(pos.x, pos.y, 4, 0, Math.PI*2);
                ctx.fill();

                // 绘制 ID 标签
                ctx.fillStyle = "rgba(255,255,255,0.7)";
                ctx.font = "10px monospace";
                ctx.fillText(p.id, pos.x + 8, pos.y - 8);
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
