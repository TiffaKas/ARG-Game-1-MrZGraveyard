<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>档案详情 - 千安公墓管理平台</title>
    <style>
        /* 继承 system.html 的全局样式 */
        :root { --p-bg: #1d2731; --gold: #b8977e; --border: #dcdfe6; --dark: #333; }
        body { 
            margin: 0; 
            font-family: "SimSun", serif; 
            background-color: #f0f2f5; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* 侧栏样式 (保持与 system.html 一致) */
        .side { 
            width: 260px; 
            background: var(--p-bg); 
            color: #fff; 
            border-right: 4px solid var(--gold); 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0;
        }
        .nav-menu { margin-top: 20px; flex: 1; }
        .menu-label { padding: 15px 25px 5px; font-size: 11px; color: #555; letter-spacing: 1px; }
        .nav-item { 
            padding: 12px 25px; 
            font-size: 14px; 
            color: var(--gold); 
            cursor: pointer; 
            transition: all 0.3s; 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.03); 
            text-decoration: none; 
        }
        .nav-item:hover { background: rgba(255,255,255,0.1); padding-left: 30px; }
        .nav-item span { margin-right: 15px; font-size: 10px; }

        /* 右侧主显示区域 */
        .main { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 40px; 
        }

        /* 档案卡片样式 */
        .record-card { 
            width: 100%; 
            max-width: 800px; 
            background: #fff; 
            border: 1px solid var(--border); 
            padding: 40px; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.1); 
        }
        .section-header { border-left: 4px solid var(--p-bg); padding-left: 12px; font-size: 18px; font-weight: bold; margin-bottom: 30px; }
        .main-info { display: flex; gap: 30px; margin-bottom: 30px; border-bottom: 1px solid #f0f0f0; padding-bottom: 30px; }
        
        .photo-box { width: 140px; text-align: center; }
        .photo-box img { 
            width: 140px; 
            height: 180px; 
            object-fit: cover; 
            border: 1px solid #eee; 
            filter: grayscale(100%) contrast(1.1); /* 保持黑白风格 */
        }
        
        .info-table { 
            flex: 1; 
            display: grid; 
            grid-template-columns: 100px 1fr 100px 1fr; 
            border-top: 1px solid #ebeef5; 
            border-left: 1px solid #ebeef5; 
        }
        .info-table div { padding: 12px; border-right: 1px solid #ebeef5; border-bottom: 1px solid #ebeef5; font-size: 14px; }
        .t-label { background: #fafafa; color: #606266; font-weight: bold; }
        
        .content-box { 
            background: #fcfcfc; 
            border: 1px solid #eee; 
            padding: 15px; 
            font-size: 14px; 
            line-height: 1.8; 
            color: #444; 
            min-height: 60px; 
            margin-bottom: 20px; 
            white-space: pre-wrap; 
            text-align: justify;
        }
    </style>
</head>
<body>

    <div class="side">
        <div style="padding:40px 20px; text-align:center">
            <h1 style="color:var(--gold); font-size:22px; letter-spacing:4px; margin:0">千安公墓</h1>
            <p style="font-size:10px; color:#555; margin-top:5px;">OBSERVER TERMINAL v7.0</p>
        </div>
        <div class="nav-menu">
            <div class="menu-label">内部管理</div>
            <a class="nav-item" href="system.html"><span>[01]</span> 档案检索模块</a>
            <a class="nav-item" href="entry.html"><span>[02]</span> 数据录入终端</a>
            <a class="nav-item" href="list.html"><span>[03]</span> 已录入档案库</a>
            <div class="menu-label">外部连接</div>
            <a class="nav-item" href="official.html"><span>●</span> 访问对外官网</a>
            <a class="nav-item" href="wechat.html"><span>●</span> 移动通讯快讯</a>
            <a class="nav-item" href="email.html"><span>●</span> 内部行政邮箱</a>
        </div>
        <div style="padding:20px; font-size:11px; color:#444;">系统状态：稳定<br>© 2026 Q-A Admin</div>
    </div>

    <div class="main">
        <div class="record-card">
            <div class="section-header">人员电子档案明细</div>
            <div class="main-info">
                <div class="photo-box">
                    <img id="v-photo" src="" alt="系统对焦照片">
                    <div style="font-size:11px; color:#999; margin-top:5px;">系统对焦图像</div>
                </div>
                <div class="info-table">
                    <div class="t-label">姓名</div><div id="v-name">-</div>
                    <div class="t-label">状态</div><div style="color: green;">正常存档</div>
                    <div class="t-label">录入时间</div><div id="v-time">-</div>
                    <div class="t-label">分类</div><div>数字化墓区</div>
                </div>
            </div>
            
            <div style="font-weight:bold; margin-bottom:10px;">生理特征提取 (Physical Observation)</div>
            <div class="content-box" id="v-bio"></div>
            
            <div style="font-weight:bold; margin-bottom:10px;">生平简述 (Biography Summary)</div>
            <div class="content-box" id="v-desc"></div>
        </div>
    </div>

    <script>
        window.onload = () => {
            const name = new URLSearchParams(window.location.search).get('name');
            const archives = JSON.parse(localStorage.getItem('cemetery_files') || '[]');
            const data = archives.find(a => a.name === name);
            
            if (data) {
                document.getElementById('v-name').innerText = data.name;
                document.getElementById('v-time').innerText = data.time;
                document.getElementById('v-bio').innerText = data.bio;
                document.getElementById('v-desc').innerText = data.desc || "无行政描述。";
                
                // 亚洲中国人像生成逻辑
                let img = "";
                if (name.includes("陈建")) {
                    img = "陈建.png"; // 亚洲男性
                } else if (name.includes("宋涵")) {
                    img = "宋涵.png"; // 亚洲女性
                } else if (name.includes("周诚")) {
                    img = "周诚.png"; // 亚洲老年男性
                } else {
                    img = "https://i.pravatar.cc/300?u=generic-asian-" + encodeURIComponent(name);
                }
                document.getElementById('v-photo').src = img;
            } else {
                document.querySelector('.record-card').innerHTML = "<h2>档案检索失败：数据已抹除或未对焦。</h2>";
            }
        };
    </script>
</body>
</html>
