<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>档案详情</title>
    <style>
        body { padding: 50px; font-family: "SimSun", serif; line-height: 1.6; background: #f5f7fa; }
        .card { max-width: 800px; margin: auto; border: 1px solid #000; padding: 40px; background: #fff; display: flex; gap: 40px; }
        .photo { width: 180px; height: 240px; border: 1px solid #ddd; background: #eee; overflow: hidden; }
        .photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); }
        .info { flex: 1; }
        .h { font-weight: bold; margin-top: 15px; border-bottom: 1px solid #eee; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <div class="photo" id="p_box"></div>
        <div class="info">
            <h2 id="name" style="margin-top:0;"></h2>
            <div class="h">系统时间</div><div id="time"></div>
            <div class="h">生理特征提取</div><p id="bio"></p>
            <div class="h">生平简述</div><p id="desc"></p>
        </div>
    </div>
    <script>
        const idx = new URLSearchParams(window.location.search).get('idx');
        const item = JSON.parse(localStorage.getItem('cemetery_files'))[idx];
        document.getElementById('name').innerText = item.name;
        document.getElementById('bio').innerText = item.bio;
        document.getElementById('desc').innerText = item.desc;
        document.getElementById('time').innerText = item.time;

        // 亚洲人像定义逻辑 (使用特定参数的头像API)
        let imgUrl = "";
        if(item.name.includes("陈建")) imgUrl = "https://i.pravatar.cc/300?u=chenjian_asian";
        else if(item.name.includes("宋涵")) imgUrl = "https://i.pravatar.cc/300?u=songhan_asian_female";
        else if(item.name.includes("周诚")) imgUrl = "https://i.pravatar.cc/300?u=zhoucheng_asian_old";
        
        document.getElementById('p_box').innerHTML = `<img src="${imgUrl}" alt="档案照片">`;
    </script>
</body>
</html>
