<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>微信 (WeChat)</title>
    <style>
        body { margin: 0; background: #ededed; font-family: sans-serif; display: flex; justify-content: center; height: 100vh; }
        .phone-container { width: 375px; background: #f3f3f3; display: flex; flex-direction: column; border: 1px solid #ddd; box-shadow: 0 0 50px rgba(0,0,0,0.1); }
        
        /* 头部 */
        .header { background: #ededed; padding: 40px 15px 10px; border-bottom: 1px solid #dbdbdb; text-align: center; font-weight: bold; position: relative; }
        .back-btn { position: absolute; left: 15px; bottom: 12px; color: #07c160; cursor: pointer; font-weight: normal; font-size: 14px; text-decoration: none; }

        /* 聊天区域 */
        .chat-area { flex: 1; overflow-y: auto; padding: 20px 15px; }
        .msg { margin-bottom: 20px; display: flex; align-items: flex-start; }
        .avatar { width: 40px; height: 40px; background: #ccc; border-radius: 4px; margin-right: 10px; flex-shrink: 0; }
        .bubble { background: #fff; padding: 10px 12px; border-radius: 6px; font-size: 15px; line-height: 1.4; max-width: 240px; position: relative; }
        .bubble::before { content: ""; position: absolute; left: -6px; top: 12px; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 6px solid #fff; }

        /* 输入框屏蔽 */
        .footer { background: #f7f7f7; padding: 15px; border-top: 1px solid #dbdbdb; text-align: center; color: #999; font-size: 13px; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <a href="system.html" class="back-btn">管理后台</a>
        张顺的家属 (张晓华)
    </div>
    
    <div class="chat-area">
        <div class="msg">
            <div class="avatar" style="background-color: #889;"></div>
            <div class="bubble">管理员您好，我是张顺的侄子。我想问下，我叔叔的档案录入了吗？</div>
        </div>
        
        <div class="msg">
            <div class="avatar" style="background-color: #889;"></div>
            <div class="bubble">他生前确实很怪，但他人不坏的。他只是...只是身体比一般人硬一些。</div>
        </div>

        <div class="msg">
            <div class="avatar" style="background-color: #889;"></div>
            <div class="bubble">那天我帮他搬家，他从楼梯上滑下去，我吓坏了，结果他站起来说地板质量真差。</div>
        </div>

        <div class="msg">
            <div class="avatar" style="background-color: #889;"></div>
            <div class="bubble">你说，人怎么能把实木地板给砸裂缝了呢？</div>
        </div>

        <div class="msg" style="opacity: 0.5;">
            <div class="avatar" style="background-color: #889;"></div>
            <div class="bubble">对方撤回了一条消息</div>
        </div>
    </div>

    <div class="footer">
        [ 系统：当前处于单向观测模式，禁止回复 ]
    </div>
</div>

</body>
</html>
