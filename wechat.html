<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>微信</title>
    <style>
        body { margin: 0; background: #ededed; font-family: sans-serif; display: flex; justify-content: center; height: 100vh; }
        .phone { width: 375px; background: #f3f3f3; border: 1px solid #ddd; display: flex; flex-direction: column; }
        .header { background: #ededed; padding: 30px 15px 10px; border-bottom: 1px solid #dbdbdb; text-align: center; font-weight: bold; }
        .chat { flex: 1; padding: 15px; overflow-y: auto; }
        .bubble { background: #fff; padding: 10px; border-radius: 5px; margin-bottom: 15px; max-width: 80%; font-size: 14px; }
        .back-link { color: #07c160; text-decoration: none; font-size: 12px; float: left; }
    </style>
</head>
<body>
    <div class="phone">
        <div class="header">
            <a href="system.html" target="_blank" class="back-link">后台</a>
            张顺的家属
        </div>
        <div class="chat">
            <div class="bubble">管理员你好，我叔叔张顺入库了吗？</div>
            <div class="bubble">搬家的时候他摔下楼，居然说地板质量差...他身体真的太硬了。</div>
        </div>
    </div>
</body>
</html>
