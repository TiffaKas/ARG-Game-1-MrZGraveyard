<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>微信 WeChat</title>
    <style>
        /* 样式部分保持不变，确保视觉上的真实感 */
        :root { --win-bg: #f5f5f5; --side-black: #2e2e2e; --list-gray: #eeeae8; --active-gray: #c8c8c8; --wechat-green: #07c160; --msg-green: #95ec69; }
        body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background-color: #f5f5f5; display: flex; height: 100vh; overflow: hidden; }
        .wechat-window { width: 100vw; height: 100vh; display: flex; background: var(--win-bg); }
        .win-side { width: 60px; background: var(--side-black); display: flex; flex-direction: column; align-items: center; padding: 20px 0; flex-shrink: 0; }
        .avatar-main { width: 35px; height: 35px; background: #888; border-radius: 4px; margin-bottom: 25px; }
        .win-list { width: 280px; background: var(--list-gray); border-right: 1px solid #dcd9d8; display: flex; flex-direction: column; }
        .list-search { padding: 25px 12px 10px; position: relative; }
        .list-search input { width: 100%; border: none; background: #dbd9d8; padding: 6px 10px; font-size: 12px; border-radius: 2px; outline: none; }
        #contactList { flex: 1; overflow-y: auto; }
        .contact-item { padding: 12px; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid #e0dbda; }
        .contact-item.active { background: var(--active-gray); }
        .contact-avatar { width: 40px; height: 40px; border-radius: 2px; margin-right: 10px; }
        .contact-info { flex: 1; overflow: hidden; }
        .contact-name { font-size: 14px; display: flex; justify-content: space-between; }
        .contact-time { font-size: 10px; color: #b2b2b2; }
        .contact-last-msg { font-size: 12px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .win-chat { flex: 1; display: flex; flex-direction: column; background: var(--win-bg); }
        .chat-header { height: 60px; padding: 0 25px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; font-size: 16px; }
        #chatBody { flex: 1; overflow-y: auto; padding: 20px 25px; display: flex; flex-direction: column; }
        .msg-row { margin-bottom: 15px; display: flex; }
        .msg-row.me { flex-direction: row-reverse; }
        .msg-avatar { width: 34px; height: 34px; border-radius: 2px; }
        .msg-bubble { background: #fff; padding: 8px 12px; border-radius: 4px; font-size: 14px; max-width: 70%; line-height: 1.6; margin: 0 12px; }
        .msg-row.me .msg-bubble { background: var(--msg-green); }
        .msg-time-tag { text-align: center; color: #b2b2b2; font-size: 11px; margin: 15px 0; }
        .chat-footer { height: 180px; border-top: 1px solid #e5e5e5; background: #fff; display: flex; flex-direction: column; }
        #messageInput { flex: 1; padding: 15px 20px; border: none; outline: none; resize: none; font-size: 14px; }
        .send-btn-row { padding: 10px 20px; display: flex; justify-content: flex-end; }
        .send-btn { background: #f5f5f5; border: 1px solid #e5e5e5; color: #07c160; padding: 4px 20px; border-radius: 2px; cursor: pointer; }
    </style>
</head>
<body>

<div class="wechat-window">
    <div class="win-side"><div class="avatar-main"></div><div class="icon" style="color:var(--wechat-green); text-align:center; cursor:default;">🗨</div></div>
    <div class="win-list">
        <div class="list-search"><input type="text" placeholder="搜索"></div>
        <div id="contactList"></div>
    </div>
    <div class="win-chat">
        <div class="chat-header"><div id="chatTitle"></div></div>
        <div id="chatBody"></div>
        <div class="chat-footer">
            <textarea id="messageInput"></textarea>
            <div class="send-btn-row"><button class="send-btn" onclick="handleSend()">发送(S)</button></div>
        </div>
    </div>
</div>

<script>
    const chatData = {
        dad: {
            name: '爸爸',
            avatar: '#4a90e2',
            messages: [
                { type: 'time', content: '2026年5月3日' },
                { type: 'other', content: '钱收到了吗？' },
                { type: 'me', content: '收到了。' },
                { type: 'other', content: '嗯，省着点花。' },
                { type: 'time', content: '昨天 18:15' },
                { type: 'other', content: '回学校记得给你妈打个电话。' },
                { type: 'other', content: '她今天念叨你一整天。' },
                { type: 'me', content: '刚跟她打过视频。' },
                { type: 'other', content: '[图片：一大盘红烧肉]' },
                { type: 'other', content: '今晚家里吃这个，你没口福。' },
                { type: 'me', content: '看上去一般般吧（流口水）' },
                { type: 'other', content: '臭小子。' },
                { type: 'other', content: '对了，大提琴那个琴弓修好了吗？' },
                { type: 'me', content: '送去店里了，得过几天。' },
                { type: 'other', content: '好。别耽误 SOTA 的选拔。' },
                { type: 'other', content: '钱不够了跟我说，别硬撑。' },
                { type: 'other', content: '在那边注意安全。' },
                { type: 'me', content: '知晓。' },
                { type: 'other', content: '这回复... 跟你大伯越来越像了。' },
                { type: 'other', content: '行了，我忙去了。' }
            ]
        },
        classmate: {
            name: '老王 (14班)',
            avatar: '#f5a623',
            messages: [
                { type: 'other', content: '救命！！！' },
                { type: 'other', content: '老卢你写完物理那个受力分析了吗？' },
                { type: 'me', content: '写了，在寝室桌子上，你自己去拿。' },
                { type: 'other', content: '大恩大德永世难忘！！' },
                { type: 'other', content: '刚才老李查岗，差点把我手机没收了。' },
                { type: 'other', content: '吓死爹了。' },
                { type: 'other', content: '诶，你周六真不去打球啊？' },
                { type: 'other', content: '妹子们都说你去我就去。' },
                { type: 'me', content: '真不去，UIC 那个剧本杀世界观还得填坑。' },
                { type: 'other', content: '又是你的宇宙信息壳... 听着就头大。' },
                { type: 'other', content: '你是不是最近写代码写傻了？' },
                { type: 'other', content: '下午帮我带瓶冰可乐，回头转你钱。' },
                { type: 'me', content: '加冰？' },
                { type: 'other', content: '必须加冰，命是可乐给的。' },
                { type: 'other', content: '对了，那个叫同非桶的加你没？' },
                { type: 'other', content: '他在群里疯狂艾特你。' },
                { type: 'me', content: '没理他。' },
                { type: 'other', content: '那哥们神神叨叨的。' },
                { type: 'other', content: '走了走了，老李又转回来了。' },
                { type: 'other', content: '溜了。' }
            ]
        },
        mom: {
            name: '妈妈',
            avatar: '#ffb3ba',
            messages: [
                { type: 'time', content: '11:30' },
                { type: 'other', content: '儿子，在吃饭吗？' },
                { type: 'other', content: '一定要多吃点青菜，别光吃肉。' },
                { type: 'other', content: '学校食堂要是太咸了就打点汤。' },
                { type: 'me', content: '正在吃。' },
                { type: 'other', content: '[分享文章：熬夜对青少年大脑的十大危害]' },
                { type: 'other', content: '你看这篇文章，别老是熬夜写你那个什么游戏。' },
                { type: 'other', content: '要注意视力。' },
                { type: 'other', content: '下周降温，我看了天气预报，只有 15 度。' },
                { type: 'other', content: '一定要穿那件灰色的厚外套。' },
                { type: 'other', content: '听到了吗？' },
                { type: 'me', content: '听到了妈... 我会穿的。' },
                { type: 'other', content: '别嫌我啰嗦，我是为你考 SOTA 着想。' },
                { type: 'other', content: '那间学校艺术氛围好，但竞争也大。' },
                { type: 'other', content: '记得多喝热水。' },
                { type: 'other', content: '上次寄给你的坚果吃完了吗？' },
                { type: 'me', content: '还有一半。' },
                { type: 'other', content: '那快点吃，别放过期了。' },
                { type: 'other', content: '【转账 200元：买水果吃】' },
                { type: 'other', content: '听话。' }
            ]
        }
    };

    let currentChatKey = 'dad';

    function renderContactList() {
        const list = document.getElementById('contactList');
        list.innerHTML = '';
        Object.keys(chatData).forEach(key => {
            const data = chatData[key];
            const div = document.createElement('div');
            div.className = `contact-item ${key === currentChatKey ? 'active' : ''}`;
            div.onclick = () => switchChat(key);
            div.innerHTML = `
                <div class="contact-avatar" style="background:${data.avatar}"></div>
                <div class="contact-info">
                    <div class="contact-name">${data.name} <span class="contact-time">17:57</span></div>
                    <div class="contact-last-msg">${data.messages[data.messages.length-1].content}</div>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function switchChat(key) {
        currentChatKey = key;
        const data = chatData[key];
        document.getElementById('chatTitle').innerText = data.name;
        const body = document.getElementById('chatBody');
        body.innerHTML = '';
        data.messages.forEach(msg => {
            if (msg.type === 'time') {
                body.innerHTML += `<div class="msg-time-tag">${msg.content}</div>`;
            } else {
                const isMe = msg.type === 'me';
                body.innerHTML += `
                    <div class="msg-row ${isMe ? 'me' : ''}">
                        <div class="msg-avatar" style="background:${isMe ? '#888' : data.avatar}"></div>
                        <div class="msg-bubble">${msg.content}</div>
                    </div>
                `;
            }
        });
        body.scrollTop = body.scrollHeight;
        renderContactList();
    }

    function handleSend() {
        const input = document.getElementById('messageInput');
        if (!input.value.trim()) return;
        chatData[currentChatKey].messages.push({ type: 'me', content: input.value });
        input.value = '';
        switchChat(currentChatKey);
    }

    window.onload = () => { renderContactList(); switchChat('dad'); };
</script>
</body>
</html>
