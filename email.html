<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>千安协作终端 - 内部邮件系统</title>
    <style>
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5; margin: 0; display: flex; height: 100vh; color: #333; }
        
        /* 侧边栏：极简办公风格 */
        .sidebar { width: 260px; background: #2c3e50; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 25px 20px; background: #1a252f; text-align: center; font-weight: bold; font-size: 16px; border-bottom: 1px solid #34495e; }
        .contact-list { flex: 1; overflow-y: auto; }
        .contact-item { padding: 15px 20px; border-bottom: 1px solid #34495e; cursor: pointer; transition: 0.3s; display: flex; align-items: center; }
        .contact-item:hover { background: #3e5871; }
        .contact-item.active { background: #3498db; }
        .avatar { width: 32px; height: 32px; background: #7f8c8d; border-radius: 4px; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }

        /* 聊天主界面 */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #fff; position: relative; }
        .chat-header { padding: 18px 30px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fff; z-index: 10; }
        .status-dot { width: 8px; height: 8px; background: #27ae60; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-text { font-size: 12px; color: #27ae60; }
        
        .message-container { flex: 1; padding: 30px; overflow-y: auto; background: #f9fbff; display: flex; flex-direction: column; gap: 20px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 4px; font-size: 14px; line-height: 1.6; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg-left { align-self: flex-start; background: #fff; border: 1px solid #e0e0e0; }
        .msg-right { align-self: flex-end; background: #dcf8c6; border: 1px solid #c5e1a5; }
        .msg-time { font-size: 11px; color: #aaa; margin-top: 8px; display: block; }

        /* 输入区 */
        .input-area { padding: 25px 30px; border-top: 1px solid #eee; display: flex; gap: 15px; background: #fff; }
        input { flex: 1; padding: 12px 15px; border: 1px solid #ddd; border-radius: 4px; outline: none; font-size: 14px; transition: border 0.3s; }
        input:focus { border-color: #3498db; }
        button { padding: 0 30px; background: #2c3e50; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #34495e; }

        /* 正在输入提示 */
        .typing { position: absolute; bottom: 95px; left: 30px; font-size: 12px; color: #999; display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">千安墓园后台管理系统</div>
        <div class="contact-list">
            <div class="contact-item active">
                <div class="avatar">杨</div>
                <div>杨先生 (内勤部)</div>
            </div>
            <div class="contact-item">
                <div class="avatar">技</div>
                <div>系统技术支持</div>
            </div>
            <div class="contact-item">
                <div class="avatar">后</div>
                <div>后勤维保组</div>
            </div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <div>当前对话：<b>杨先生</b></div>
            <div>
                <span class="status-dot"></span>
                <span class="status-text">在线</span>
            </div>
        </div>
        
        <div class="message-container" id="chatBox">
            <div class="msg msg-left">
                你好，我是杨先生。欢迎入职千安公墓。你现在的系统权限应该已经开通了，有问题可以随时联系我。
                <span class="msg-time">09:05</span>
            </div>
        </div>

        <div id="typingIndicator" class="typing">杨先生正在输入...</div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="在此输入你的疑问..." autocomplete="off">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const keywords = ["红点", "保安", "实时", "墓位", "平面图"];
        const standardReply = "是正在巡逻的保安，我们的系统比较先进，他们巡逻的位置和实时信息会更新在实时墓位平面图上，不过信息是根据保安的对讲机走的，有时候他们对讲机忘拿了就会原地不动，如果你看到问题可以跟我说一下，我联系他们。";

        // 处理回车发送
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();

            if (!text) return;

            // 渲染用户消息
            appendMessage('msg-right', text);
            input.value = '';

            // 自动回复逻辑
            const containsKeyword = keywords.some(k => text.includes(k));
            
            showTyping(true);
            
            // 模拟人类思考和打字延迟
            const delay = containsKeyword ? 3500 : 2000;
            
            setTimeout(() => {
                showTyping(false);
                if (containsKeyword) {
                    appendMessage('msg-left', standardReply);
                } else {
                    appendMessage('msg-left', "这个问题建议你先查阅一下《员工手册》里的系统操作指南部分，如果还有疑问我再去问问主管。");
                }
            }, delay);
        }

        function appendMessage(type, content) {
            const chatBox = document.getElementById('chatBox');
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerHTML = `${content}<span class="msg-time">${time}</span>`;
            chatBox.appendChild(msgDiv);
            
            // 自动滚动到底部
            chatBox.scrollTo({
                top: chatBox.scrollHeight,
                behavior: 'smooth'
            });
        }

        function showTyping(show) {
            document.getElementById('typingIndicator').style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
