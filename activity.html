<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>千安公墓 - 员工意见征集</title>
    <style>
        :root { --office-red: #c0392b; --paper-bg: #f2f2f2; } 
        body { margin: 0; font-family: "SimSun", serif; background-color: var(--paper-bg); display: flex; height: 100vh; overflow: hidden; }
        .flash-fail { animation: flash 0.3s ease-in-out; }
        @keyframes flash { 0% {background: var(--paper-bg);} 50% {background:#d0d0d0;} 100% {background: var(--paper-bg);} }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .document-container { background: #fff; width: 100%; max-width: 800px; padding: 60px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-radius: 2px; }
        .doc-header { border-bottom: 2px solid var(--office-red); text-align: center; margin-bottom: 30px; }
        .form-window { margin-top: 40px; border: 1px solid #ddd; background: #fff; padding: 25px; }
        .help-btn { display: none; position: fixed; bottom: 20px; right: 20px; padding: 8px 15px; background: #444; color: #fff; border-radius: 20px; cursor: pointer; z-index: 1500; }
        .help-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; background: #fff; border: 1px solid #000; padding: 20px; z-index: 2000; }
        #result-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; align-items: center; justify-content: center; color: #fff; }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="document-container">
            <div class="doc-header"><h1>千安公墓内部管理文件</h1></div>
            <div class="form-window">
                <div id="hint-text" style="color:red; visibility:hidden;">错误提示</div>
                <input type="text" id="userName" placeholder="请输入姓名（顾叙）" style="width:100%; margin-bottom:10px; padding:10px;">
                <textarea id="userContent" placeholder="请输入建议..." style="width:100%; height:120px; padding:10px;"></textarea>
                <button onclick="validateSuggestion()" style="background:var(--office-red); color:#fff; padding:10px 20px; border:none; cursor:pointer;">提交意见</button>
            </div>
        </div>
    </div>
    <div class="help-btn" onclick="toggleHelp(true)">遇到困难？</div>
    <div id="helpModal" class="help-modal">
        <span onclick="toggleHelp(false)" style="float:right; cursor:pointer;">×</span>
        <h3>提示：34万定价、成本膨胀、14.3%资产留存率。</h3>
    </div>
    <div id="result-overlay"><div style="background:#fff; color:#000; padding:40px;">已录入建议库，正在同步审计终端...</div></div>

    <script>
        function checkHelpAvailability() {
            const totalTime = parseInt(localStorage.getItem('total_reading_time') || "0");
            if (totalTime >= 30000) document.querySelector('.help-btn').style.display = 'block';
        }
        function toggleHelp(show) { document.getElementById('helpModal').style.display = show ? 'block' : 'none'; }
        function validateSuggestion() {
            const name = document.getElementById('userName').value;
            const content = document.getElementById('userContent').value;
            if (name === "顾叙" && content.includes("34万") && content.includes("14.3%")) {
                localStorage.setItem('audit_submit_timestamp', Date.now());
                localStorage.setItem('wei_contact_state', 'waiting');
                document.getElementById('result-overlay').style.display = 'flex';
                setTimeout(() => window.location.href = 'system.html', 3000);
            } else {
                document.body.classList.add('flash-fail');
                setTimeout(() => document.body.classList.remove('flash-fail'), 300);
            }
        }
        window.onload = () => { checkHelpAvailability(); setInterval(checkHelpAvailability, 1000); };
    </script>
</body>
</html>
