<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Google</title>
    <style>
        body { margin: 0; font-family: arial, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        .top { width: 100%; display: flex; justify-content: flex-end; padding: 20px; box-sizing: border-box; }
        .logo { font-size: 80px; margin-top: 100px; font-weight: bold; letter-spacing: -5px; }
        .search-box { width: 500px; padding: 12px 20px; border: 1px solid #dfe1e5; border-radius: 24px; font-size: 16px; outline: none; margin-top: 30px; }
        .search-box:hover { box-shadow: 0 1px 6px rgba(32,33,36,0.28); }
    </style>
</head>
<body>
    <div class="top">
        <a href="system.html" target="_blank" style="text-decoration:none; color:#4285F4; font-weight:bold;">返回工作端</a>
    </div>
    <div class="logo">
        <span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC05">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span>
    </div>
    <input type="text" class="search-box" placeholder="在互联网上搜索信息...">
</body>
</html>
