<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>工作守则 - 千安公墓管理平台</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; --dark: #333; --paper: #ffffff; }
        body { margin: 0; font-family: "SimSun", serif; background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }

        .main { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; background: #e0e0e0; }
        
        .manual-page {
            width: 100%; max-width: 750px; background: var(--paper);
            padding: 60px 80px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #ccc; position: relative; margin-bottom: 40px;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); /* 用于放大动画 */
        }

        /* 分裂动画相关的特殊类 */
        .page-zoomed { transform: scale(1.05); z-index: 100; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        
        /* 模拟撕裂后的半截纸张 */
        .tear-part {
            position: fixed; left: 50%; width: 750px; height: 50vh;
            background: var(--paper); border: 1px solid #ccc;
            margin-left: -375px; z-index: 200; pointer-events: none;
            transition: transform 1.2s cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }

        h1 { text-align: center; font-size: 24px; margin-bottom: 20px; text-decoration: underline; color: #000; letter-spacing: 2px; }
        .manual-subtitle { text-align: center; font-size: 12px; color: #666; margin-bottom: 40px; font-style: italic; }
        
        h2 { font-size: 18px; margin-top: 35px; border-bottom: 2px solid #000; padding-bottom: 8px; color: #000; font-weight: bold; }
        .rule-block { margin: 18px 0; }
        .rule-title { font-weight: bold; color: #000; margin-bottom: 4px; display: block; font-size: 15px; }
        .rule-content { line-height: 1.8; color: #1a1a1a; font-size: 14px; text-align: justify; display: block; padding-left: 1.5em; }
        
        .perforated-container {
            width: 100%; margin: 45px 0; text-align: center; position: relative;
            height: 40px; cursor: ew-resize; user-select: none;
        }
        .perforated-line {
            border-top: 2px dashed #bbb; width: calc(100% + 160px); margin-left: -80px;
            position: absolute; top: 50%; left: 0; z-index: 1;
        }
        
        #tear-overlay {
            position: absolute; top: 50%; right: -80px;
            width: 0; height: 10px; background: var(--paper); 
            transform: translateY(-50%); z-index: 5;
            pointer-events: none;
        }

        #tear-handle {
            position: absolute; top: 50%; right: -80px;
            width: 50px; height: 30px; background: #eee;
            border: 1px solid #ccc; border-radius: 3px;
            transform: translateY(-50%); z-index: 10;
            cursor: grab; display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #666; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .sensor-tag { font-size: 10px; color: #aaa; letter-spacing: 2px; margin-top: 10px; text-transform: uppercase; }
        .footer-note { margin-top: 80px; font-size: 12px; text-align: center; color: #888; border-top: 1px solid #eee; padding-top: 20px; }

        .is-torn #tear-overlay { width: calc(100% + 160px) !important; }
        .is-torn #tear-handle { display: none; }
    </style>
</head>
<body>

    <script src="sidebar.js"></script>

    <div class="main" id="mainContainer">
        <div class="manual-page" id="manualDoc">
            <h1>工作守则</h1>
            <p class="manual-subtitle">本守则和实体手册相同，但推荐在数字化终端保存备份。</p>

            <h2>第一章：行为准则与职业操守</h2>
            <div class="rule-block">
                <span class="rule-title">1.1 廉洁准则</span>
                <span class="rule-content">严禁收受贿赂。员工不得向丧家索取或收受任何非法费用，违者将依法处理。</span>
            </div>
            <div class="rule-block">
                <span class="rule-title">1.2 敬业与禁忌</span>
                <span class="rule-content">遵循“尊严、尊重”原则。保持环境整洁肃穆。</span>
            </div>

            <div class="perforated-container" id="tearZone">
                <div class="perforated-line"></div>
                <div id="tear-overlay"></div>
                <div id="tear-handle">◀ 撕开</div>
                <div class="sensor-tag">HSD-INTERNAL-SENSOR-V7</div>
            </div>

            <h2>第二章：工作职责与管理流程</h2>
            <div class="rule-block">
                <span class="rule-title">2.1 墓基管理</span>
                <span class="rule-content">负责巡查、准确测量墓基，确保施工单位按规定营葬。</span>
            </div>
            
            <div class="rule-block">
                <span class="rule-title">3.2 紧急联动报警</span>
                <span class="rule-content">如遇无法解决的异常状况，请立即将实体手册沿着虚线撕开。</span>
            </div>

            <div class="footer-note">
                千安公墓数字化行政中心<br>
                INTERNAL DOCUMENT - V7.0.2 (2026)
            </div>
        </div>
    </div>

    <script>
        (function() {
            const handle = document.getElementById('tear-handle');
            const overlay = document.getElementById('tear-overlay');
            const zone = document.getElementById('tearZone');
            const doc = document.getElementById('manualDoc');
            const maxPull = zone.offsetWidth + 160; 
            
            let dragging = false;
            let startX = 0;

            if (localStorage.getItem('document_torn') === 'true') {
                document.body.classList.add('is-torn');
            }

            handle.addEventListener('mousedown', (e) => {
                if (localStorage.getItem('document_torn') === 'true') return;
                dragging = true;
                startX = e.clientX;
                handle.style.transition = "none";
                overlay.style.transition = "none";
            });

            window.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                let moveX = startX - e.clientX;
                if (moveX < 0) moveX = 0;
                if (moveX > maxPull) moveX = maxPull;
                handle.style.right = (moveX - 80) + 'px';
                overlay.style.width = moveX + 'px';
                if (moveX >= maxPull * 0.98) completeTear();
            });

            window.addEventListener('mouseup', () => {
                if (!dragging || localStorage.getItem('document_torn') === 'true') return;
                dragging = false;
                handle.style.transition = "all 0.4s ease";
                overlay.style.transition = "all 0.4s ease";
                handle.style.right = '-80px';
                overlay.style.width = '0';
            });

            function completeTear() {
                dragging = false;
                localStorage.setItem('document_torn', 'true');
                document.body.classList.add('is-torn');

                // 1. 放大动画
                doc.classList.add('page-zoomed');

                // 停留 1 秒后开始分裂
                setTimeout(() => {
                    const rect = doc.getBoundingClientRect();
                    const splitY = zone.getBoundingClientRect().top + 20;

                    // 2. 隐藏原文档，显示分裂层
                    doc.style.visibility = 'hidden';

                    const topPart = document.createElement('div');
                    topPart.className = 'tear-part';
                    topPart.style.top = rect.top + 'px';
                    topPart.style.height = (splitY - rect.top) + 'px';
                    topPart.style.clipPath = 'inset(0 0 0 0)';
                    topPart.innerHTML = doc.innerHTML;
                    
                    const bottomPart = document.createElement('div');
                    bottomPart.className = 'tear-part';
                    bottomPart.style.top = splitY + 'px';
                    bottomPart.style.height = (rect.bottom - splitY) + 'px';
                    // 修正下半部分的内容偏移
                    bottomPart.style.overflow = 'hidden';
                    const inner = document.createElement('div');
                    inner.innerHTML = doc.innerHTML;
                    inner.style.marginTop = -(splitY - rect.top) + 'px';
                    bottomPart.appendChild(inner);

                    document.body.appendChild(topPart);
                    document.body.appendChild(bottomPart);

                    // 3. 执行移出屏幕动画
                    requestAnimationFrame(() => {
                        topPart.style.transform = `translateY(-${window.innerHeight}px) rotate(-5deg)`;
                        bottomPart.style.transform = `translateY(${window.innerHeight}px) rotate(5deg)`;
                    });

                    // 最后跳转
                    setTimeout(() => {
                        window.location.href = 'ending.html';
                    }, 1200);

                }, 1000);
            }
        })();
    </script>
</body>
</html>
