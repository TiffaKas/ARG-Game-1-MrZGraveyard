<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>千安公墓 - 季度财务结算报告</title>
    <style>
        :root { --p-bg: #333; --dark: #000; --ai-bg: #fff; }
        body { margin: 0; font-family: "SimSun", serif; background-color: #f4f6f8; display: flex; height: 100vh; overflow: hidden; position: relative; color: var(--dark); }
        
        .main { flex: 1; padding: 50px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        .report-paper { background: #fff; width: 100%; max-width: 850px; padding: 60px; box-shadow: 0 0 10px rgba(0,0,0,0.05); box-sizing: border-box; border: 1px solid #ddd; }
        
        .header { text-align: center; border-bottom: 2px solid var(--dark); padding-bottom: 20px; margin-bottom: 40px; }
        .header h1 { margin: 0; font-size: 26px; letter-spacing: 4px; }

        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #eee; border: 1px solid #eee; margin-bottom: 40px; }
        .summary-item { background: #fff; padding: 20px; text-align: center; }
        .label { font-size: 12px; color: #666; margin-bottom: 10px; display: block; }
        .value { font-size: 20px; font-family: "Georgia", serif; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px; }
        table th { background: #f9f9f9; text-align: left; padding: 12px; border-bottom: 1px solid #000; }
        table td { padding: 12px; border-bottom: 1px solid #eee; }
        .text-right { text-align: right; }
        
        .total-row { font-weight: bold; background: #fafafa; border-top: 1px solid #000; }
        
        /* AI 助手 - 黑白专业版 */
        #ai-assistant { 
            position: fixed; right: -400px; top: 100px; width: 320px; 
            background: var(--ai-bg); border: 1px solid #000; 
            box-shadow: 0 0 15px rgba(0,0,0,0.1); 
            transition: right 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 1000; padding: 20px;
        }
        #ai-assistant.active { right: 30px; }
        .ai-title { font-weight: bold; border-bottom: 1px solid #000; padding-bottom: 8px; margin-bottom: 15px; display: flex; align-items: center; }
        .ai-title::before { content: "●"; color: #000; margin-right: 8px; }
        .ai-link { display: block; padding: 10px; margin: 8px 0; background: #fff; text-decoration: none; color: #333; border: 1px solid #ddd; font-size: 13px; }
        .ai-link:hover { background: #f0f0f0; border-color: #000; }
        .ai-desc { font-size: 11px; color: #666; margin-top: 4px; display: block; }
    </style>
</head>
<body>

    <script src="sidebar.js"></script>

    <div class="main">
        <div class="report-paper">
            <div class="header">
                <h1>千安公墓季度财务审计报告</h1>
                <p>统计周期：2026年Q2 | 货币单位：人民币 (CNY)</p>
            </div>

            <div class="summary-grid">
                <div class="summary-item">
                    <span class="label">账面合约总额</span>
                    <span class="value" id="gross-total">加载中...</span>
                </div>
                <div class="summary-item">
                    <span class="label">本季实收毛利</span>
                    <span class="value" id="net-revenue">加载中...</span>
                </div>
                <div class="summary-item">
                    <span class="label">资产留存率</span>
                    <span class="value" id="retention-rate">0.0%</span>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>核算科目</th>
                        <th class="text-right">金额</th>
                        <th>审计说明</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="ai-assistant">
        <div class="ai-title">为你推荐</div>
        <p style="font-size: 13px; color: #333; margin-bottom: 15px;">检测到用户阅读内容，建议查阅：</p>
        
        <a href="article1.html" class="ai-link">
            <strong>行业报告：墓位价格合理性评估</strong>
            <span class="ai-desc">分析指出：千安墓园均价（34万）远高于区域红线。</span>
        </a>

        <a href="article2.html" class="ai-link">
            <strong>《企业财务报告编制指南》常见错误</strong>
            <span class="ai-desc">指出本报告在递延收益科目处理上的合规风险。</span>
        </a>
    </div>

    <script>
        // 使用 DOMContentLoaded 确保 HTML 解析完成后立即执行
        document.addEventListener('DOMContentLoaded', () => {
            renderFinancialReport();
            
            // AI 助手滑动效果
            setTimeout(() => {
                const aiAssistant = document.getElementById('ai-assistant');
                if (aiAssistant) aiAssistant.classList.add('active');
            }, 1500);
        });

        function renderFinancialReport() {
            // 静态审计核心数据
            const grossValue = 5100000; 
            const netValue = 727500;    
            const retentionRate = "14.3%";

            // 1. 填充顶部数值卡片
            const grossEl = document.getElementById('gross-total');
            const netEl = document.getElementById('net-revenue');
            const rateEl = document.getElementById('retention-rate');

            if (grossEl) grossEl.textContent = "￥" + grossValue.toLocaleString();
            if (netEl) netEl.textContent = "￥" + netValue.toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            if (rateEl) rateEl.textContent = retentionRate;

            // 2. 拟造详细科目数据
            const dataRows = [
                ["主营业务销售额", "￥5,100,000", "结算标准：340,000/件 (共15件)"],
                ["减：营业税金 (12.5%)", "- ￥637,500", "政策性税费支出"],
                ["减：合同负债 (预收递延)", "- ￥2,040,000", "计提比例：40%"],
                ["减：生态修复专项储备 (20%)", "- ￥1,020,000", "专项用途准备金计提"],
                ["减：基础土地成本摊销", "- ￥675,000", "固定资产折旧及土地分摊"]
            ];

            const tbody = document.getElementById('table-body');
            if (!tbody) return;

            // 清空旧数据（防止重复渲染）
            tbody.innerHTML = "";

            dataRows.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r[0]}</td>
                    <td class="text-right">${r[1]}</td>
                    <td>${r[2]}</td>
                `;
                tbody.appendChild(tr);
            });

            // 3. 汇总行
            const totalTr = document.createElement('tr');
            totalTr.className = "total-row";
            totalTr.innerHTML = `
                <td>本季度净利润 (实收)</td>
                <td class="text-right">￥727,500.00</td>
                <td>综合结算率：${retentionRate}</td>
            `;
            tbody.appendChild(totalTr);
        }
    </script>
</body>
</html>
