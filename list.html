<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>已录入档案库 - 千安公墓管理平台</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; --dark: #333; --border: #dcdfe6; }
        body { margin: 0; font-family: "SimSun", serif; background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }

        /* 侧栏样式 - 与 system.html 保持 100% 一致 */
        .side { width: 260px; background: var(--p-bg); color: #fff; border-right: 4px solid var(--gold); display: flex; flex-direction: column; flex-shrink: 0; }
        .nav-menu { margin-top: 20px; flex: 1; overflow-y: auto; }
        .menu-label { padding: 15px 25px 5px; font-size: 11px; color: #555; letter-spacing: 1px; }
        .nav-item { padding: 12px 25px; font-size: 14px; color: var(--gold); cursor: pointer; transition: all 0.3s; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .nav-item:hover { background: rgba(255,255,255,0.1); padding-left: 30px; }
        .nav-item span { margin-right: 15px; font-size: 10px; }

        /* 主区域样式 */
        .main { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .content-container { width: 100%; max-width: 900px; background: #fff; padding: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        h2 { border-left: 4px solid var(--gold); padding-left: 15px; font-weight: normal; margin-bottom: 30px; color: var(--dark); font-size: 18px; }

        /* 表格样式优化 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #fafafa; color: #606266; font-weight: bold; text-align: left; padding: 15px; border-bottom: 2px solid #ebeef5; font-size: 14px; }
        td { padding: 15px; border-bottom: 1px solid #ebeef5; color: #444; font-size: 14px; }
        tr:hover { background-color: #f9f9f9; }
        
        .name-link { color: #b8977e; text-decoration: none; font-weight: bold; border-bottom: 1px solid transparent; transition: all 0.2s; }
        .name-link:hover { border-bottom-color: var(--gold); }
        .status-tag { color: #67c23a; background: #f0f9eb; padding: 4px 8px; border-radius: 2px; font-size: 12px; }
        
        #empty-msg { text-align: center; padding: 50px; color: #999; font-style: italic; }
    </style>
</head>
<body>

    <div class="side">
        <div style="padding:40px 20px; text-align:center">
            <h1 style="color:var(--gold); font-size:22px; letter-spacing:4px; margin:0">千安公墓</h1>
            <p style="font-size:10px; color:#555; margin-top:5px;">ADMIN TERMINAL v7.0</p>
        </div>
        <div class="nav-menu">
            <div class="menu-label">内部管理</div>
            <div class="nav-item" onclick="location.href='system.html'"><span> [01] </span> 档案检索模块</div>
            <div class="nav-item" onclick="location.href='entry.html'"><span> [02] </span> 数据录入终端</div>
            <div class="nav-item" onclick="location.href='list.html'"><span> [03] </span> 已录入档案库</div>
            <div class="nav-item" onclick="location.href='diagram.html'"><span> [04] </span> 实时墓位平面图</div>
            <div class="nav-item" onclick="location.href='complain.html'"><span> [05] </span> 异常投诉报告</div>
            <div class="nav-item" onclick="location.href='email.html'"><span> [06] </span> 内部行政邮箱</div>

            <div class="menu-label">外部连接</div>
            <div class="nav-item" onclick="location.href='official.html'"><span> - </span> 访问对外官网</div>
            <div class="nav-item" onclick="window.open('https://www.google.com')"><span> - </span> 全网搜索引擎</div>
        </div>
        <div style="padding:20px; font-size:11px; color:#444;">系统状态：稳定<br>© 2026 Q-A Admin</div>
    </div>

    <div class="main">
        <div class="content-container">
            <h2>数字化管理：已录入档案清单</h2>
            <table id="archive-table">
                <thead>
                    <tr>
                        <th width="100">编号</th>
                        <th>姓名 (点击查看详细对焦)</th>
                        <th>录入时间</th>
                        <th width="120">状态</th>
                    </tr>
                </thead>
                <tbody id="list-content"></tbody>
            </table>
            <div id="empty-msg" style="display:none;">[ 警告：数据库为空，请前往数据录入终端 ]</div>
        </div>
    </div>

    <script>
        window.onload = () => {
            const archives = JSON.parse(localStorage.getItem('cemetery_files') || '[]');
            const container = document.getElementById('list-content');
            
            if (archives.length === 0) {
                document.getElementById('empty-msg').style.display = 'block';
                document.getElementById('archive-table').style.display = 'none';
            } else {
                archives.forEach((item, index) => {
                    const row = document.createElement('tr');
                    // 编号自动补齐为三位数
                    const serial = String(index + 1).padStart(3, '0');
                    row.innerHTML = `
                        <td>#${serial}</td>
                        <td><a class="name-link" href="detail.html?name=${encodeURIComponent(item.name)}">${item.name}</a></td>
                        <td style="color: #909399;">${item.time}</td>
                        <td><span class="status-tag">正常归档</span></td>
                    `;
                    container.appendChild(row);
                });
            }
        };
    </script>
</body>
</html>
