<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>已录入档案库 - 千安公墓管理平台</title>
    <style>
        /* 仅保留档案列表业务相关的核心样式 */
        :root { --gold: #b8977e; --dark: #333; }
        body { margin: 0; font-family: "SimSun", serif; background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }

        /* 主区域样式 - 适配 sidebar.js */
        .main { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        
        /* 表格卡片容器 */
        .content-container { 
            width: 100%; 
            max-width: 900px; 
            background: #fff; 
            padding: 40px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            min-height: 500px;
            border: 1px solid #ddd;
        }
        
        h2 { border-left: 4px solid var(--gold); padding-left: 15px; font-weight: normal; margin-bottom: 30px; color: var(--dark); font-size: 18px; }

        /* 表格样式优化 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #fafafa; color: #606266; font-weight: bold; text-align: left; padding: 15px; border-bottom: 2px solid #ebeef5; font-size: 14px; }
        td { padding: 15px; border-bottom: 1px solid #ebeef5; color: #444; font-size: 14px; }
        tr:hover { background-color: #f9f9f9; }
        
        .name-link { color: var(--gold); text-decoration: none; font-weight: bold; border-bottom: 1px solid transparent; transition: all 0.2s; }
        .name-link:hover { border-bottom-color: var(--gold); }
        
        /* 精致的状态标签 */
        .status-tag { 
            color: #67c23a; 
            background: #f0f9eb; 
            padding: 4px 10px; 
            border-radius: 2px; 
            font-size: 12px; 
            border: 1px solid #e1f3d8;
        }
        
        #empty-msg { text-align: center; padding: 100px 50px; color: #999; font-style: italic; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 引用统一侧边栏脚本 -->
    <script src="task.js"></script>
    <script src="sidebar.js"></script>

    <div class="main">
        <div class="content-container">
            <h2>数字化管理：已录入档案清单</h2>
            
            <div id="empty-msg" style="display:none;">[ 警告：本地存储库为空，请先前往数据录入终端进行操作 ]</div>
            
            <table id="archive-table">
                <thead>
                    <tr>
                        <th width="100">编号</th>
                        <th>姓名 (点击查看详细对焦)</th>
                        <th>录入时间</th>
                        <th width="120">状态</th>
                    </tr>
                </thead>
                <tbody id="list-content"></tbody>
            </table>
        </div>
    </div>

    <script>
        window.onload = () => {
            // 获取并校验本地存储数据
            const archives = JSON.parse(localStorage.getItem('cemetery_files') || '[]');
            const container = document.getElementById('list-content');
            const table = document.getElementById('archive-table');
            const emptyMsg = document.getElementById('empty-msg');
            
            if (archives.length === 0) {
                emptyMsg.style.display = 'block';
                table.style.display = 'none';
            } else {
                emptyMsg.style.display = 'none';
                table.style.display = 'table';
                
                // 动态构建档案行
                archives.forEach((item, index) => {
                    const row = document.createElement('tr');
                    // 编号三位自动补齐
                    const serial = String(index + 1).padStart(3, '0');
                    row.innerHTML = `
                        <td>#${serial}</td>
                        <td><a class="name-link" href="detail.html?name=${encodeURIComponent(item.name)}">${item.name}</a></td>
                        <td style="color: #909399;">${item.time}</td>
                        <td><span class="status-tag">正常归档</span></td>
                    `;
                    container.appendChild(row);
                });
            }
        };
    </script>
</body>
</html>
