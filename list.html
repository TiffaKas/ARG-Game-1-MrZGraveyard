<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>档案库中心 - 千安公墓</title>
    <style>
        :root { --ink: #000; --paper: #fff; }
        body { background: #e0e0e0; margin: 0; padding: 40px; font-family: "SimSun", serif; display: flex; justify-content: center; }
        
        .container { 
            width: 100%; max-width: 1000px; background: var(--paper); 
            padding: 50px; border: 1px solid var(--ink); min-height: 80vh;
        }

        h2 { text-align: center; border-bottom: 1px solid var(--ink); padding-bottom: 15px; margin-bottom: 30px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #f2f2f2; font-weight: normal; border-bottom: 2px solid var(--ink); }
        
        .back-link { 
            display: inline-block; text-decoration: none; color: var(--ink); 
            border: 1px solid var(--ink); padding: 5px 15px; margin-bottom: 20px; font-size: 13px;
        }
        .back-link:hover { background: #eee; }

        .no-data { text-align: center; padding: 50px; color: #888; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <a href="system.html" class="back-link">← 返回管理系统</a>
    <h2>数字化档案存储清单</h2>
    
    <table id="archiveTable">
        <thead>
            <tr>
                <th width="15%">索引号</th>
                <th width="15%">姓氏</th>
                <th width="45%">生理资料摘要</th>
                <th width="25%">录入时间</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
    <div id="emptyMsg" class="no-data" style="display:none;">未检测到已封存的数字化记录。</div>
</div>

<script>
    window.onload = function() {
        const archives = JSON.parse(localStorage.getItem('cemetery_files') || '[]');
        const tableBody = document.getElementById('tableBody');
        const emptyMsg = document.getElementById('emptyMsg');

        if (archives.length === 0) {
            emptyMsg.style.display = 'block';
            return;
        }

        // 按时间倒序显示，最新的在上面
        archives.reverse().forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.id}</td>
                <td>${item.name || "无名氏"}</td>
                <td title="${item.bio}">${item.bio.substring(0, 50)}${item.bio.length > 50 ? '...' : ''}</td>
                <td>${item.time}</td>
            `;
            tableBody.appendChild(row);
        });
    };
</script>

</body>
</html>
