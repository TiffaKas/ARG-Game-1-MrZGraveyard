<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>已录入档案库 - 千安公墓</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; --dark: #333; }
        body { margin: 0; font-family: "SimSun", serif; background-color: #f0f2f5; display: flex; height: 100vh; }
        
        /* 侧边栏保持一致 */
        .side { width: 260px; background: var(--p-bg); color: #fff; border-right: 4px solid var(--gold); display: flex; flex-direction: column; }
        .nav-menu { margin-top: 20px; flex: 1; }
        .menu-label { padding: 15px 25px 5px; font-size: 11px; color: #555; letter-spacing: 1px; }
        .nav-item { padding: 12px 25px; font-size: 14px; color: var(--gold); cursor: pointer; transition: 0.3s; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        
        /* 主内容区 */
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .header-bar { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        h2 { margin: 0; font-weight: normal; letter-spacing: 2px; }
        
        /* 表格样式 */
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th { background: #eee; text-align: left; padding: 12px; font-size: 13px; border: 1px solid #ddd; }
        td { padding: 12px; border: 1px solid #ddd; font-size: 14px; color: #444; }
        tr:nth-child(even) { background: #fafafa; }
        .empty-hint { text-align: center; padding: 50px; color: #999; font-style: italic; }
    </style>
</head>
<body>

    <div class="side">
        <div style="padding:40px 20px; text-align:center">
            <h1 style="color:var(--gold); font-size:22px; letter-spacing:4px; margin:0">千安公墓</h1>
            <p style="font-size:10px; color:#555; margin-top:5px;">OBSERVER TERMINAL v7.0</p>
        </div>
        <div class="nav-menu">
            <div class="menu-label">内部管理</div>
            <div class="nav-item" onclick="location.href='system.html'"><span>[01]</span> 档案检索模块</div>
            <div class="nav-item" onclick="location.href='entry.html'"><span>[02]</span> 数据录入终端</div>
            <div class="nav-item" onclick="location.href='list.html'" style="background: rgba(255,255,255,0.1);"><span>[03]</span> 已录入档案库</div>
            <div class="menu-label">外部连接</div>
            <div class="nav-item" onclick="location.href='official.html'"><span>●</span> 访问对外官网</div>
            <div class="nav-item" onclick="location.href='wechat.html'"><span>●</span> 移动通讯快讯</div>
            <div class="nav-item" onclick="location.href='email.html'"><span>●</span> 内部行政邮箱</div>
        </div>
    </div>

    <div class="main">
        <div class="header-bar">
            <h2>已录入档案清单 (Archive List)</h2>
            <span style="font-size:12px; color:#666;">当前版本：2026.04.25</span>
        </div>

        <table id="archive-table">
            <thead>
                <tr>
                    <th style="width: 80px;">编号</th>
                    <th>姓名/索引项</th>
                    <th>录入时间</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody id="list-content">
                </tbody>
        </table>
        <div id="empty-msg" class="empty-hint" style="display:none;">暂无已对焦档案，请前往录入终端处理原始附单。</div>
    </div>

    <script>
        window.onload = () => {
            const archives = JSON.parse(localStorage.getItem('cemetery_files') || '[]');
            const container = document.getElementById('list-content');
            const emptyMsg = document.getElementById('empty-msg');

            if (archives.length === 0) {
                emptyMsg.style.display = 'block';
                document.getElementById('archive-table').style.display = 'none';
            } else {
                archives.forEach((item, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>#00${index + 1}</td>
                        <td>${item.name}</td>
                        <td>${item.time}</td>
                        <td style="color: green;">已定义 (Defined)</td>
                    `;
                    container.appendChild(row);
                });
            }
        };
    </script>
</body>
</html>
