<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>访问协议 - 千安公墓管理系统</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; --dark: #333; }
        body { margin: 0; font-family: sans-serif; background-color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .box { max-width: 600px; padding: 40px; line-height: 1.6; color: var(--dark); border: 1px solid #eee; }
        details { margin: 20px 0; background: #fff9e6; border: 1px dashed var(--gold); padding: 10px; font-size: 13px; }
        summary { cursor: pointer; color: var(--gold); font-weight: bold; }
        .btn { margin-top: 30px; padding: 15px 50px; background: var(--p-bg); color: var(--gold); border: none; cursor: pointer; font-weight: bold; width: 100%; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center; color:var(--p-bg)">作者寄语</h2>
        <p>欢迎。你是一个墓地管理员，来到千安公墓工作。你的任务是在正常工作中，通过系统发现异常。</p>
        <p>建议在手边准备一个<strong>记事本</strong>，记录下观察到的所有变化。在这个系统里，细节决定真相。</p>
        <details>
            <summary>提示：（建议一周目没懂的二周目看）</summary>
            <p>提示：档案显示的触发条件与访问者的 <strong>San值（理智值）</strong> 挂钩。如果你发现录入失败，说明你的描述偏离了“真实”。</p>
        </details>
        <button class="btn" onclick="window.open('system.html', '_blank')">我已阅读并知晓</button>
    </div>
</body>
</html>
