<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千安公墓 - 访问协议与系统入口</title>
    <style>
        :root { --primary-bg: #1d2731; --accent-gold: #b8977e; --text-dark: #333; }
        body { margin: 0; font-family: "PingFang SC", sans-serif; background-color: #f0f2f5; }

        /* 引导页 */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; z-index: 1000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: opacity 0.8s ease;
        }
        .content-box { max-width: 650px; padding: 40px; background: #fff; line-height: 1.8; color: var(--text-dark); }
        
        /* 提示框样式 */
        details {
            margin-top: 20px;
            background: #fff9e6;
            border: 1px dashed #d4af37;
            padding: 10px;
            font-size: 13px;
        }
        summary { cursor: pointer; color: #b8977e; font-weight: bold; outline: none; }
        
        .disclaimer-text { 
            font-size: 13px; color: #888; border-top: 1px solid #eee; 
            margin-top: 30px; padding-top: 20px;
        }
        .start-btn { 
            margin-top: 40px; padding: 16px 80px; background: var(--primary-bg); color: var(--accent-gold); 
            border: none; cursor: pointer; letter-spacing: 4px; font-weight: bold;
        }

        /* 主系统（初始隐藏） */
        #main-system { display: none; height: 100vh; width: 100%; }
        .sidebar { width: 280px; background-color: var(--primary-bg); color: #ecf0f1; display: flex; flex-direction: column; border-right: 4px solid var(--accent-gold); }
        .main-panel { flex: 1; padding: 80px; display: flex; flex-direction: column; align-items: center; }
        .search-card { background: white; padding: 60px; width: 100%; max-width: 550px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        input { width: 100%; padding: 18px; border: 1px solid #ddd; margin-bottom: 30px; box-sizing: border-box; }
        button#search-btn { width: 100%; padding: 18px; background: var(--primary-bg); color: var(--accent-gold); border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="content-box">
            <h2 style="text-align: center;">作者寄语</h2>
            <p>
                欢迎。你即将进入《千安公墓》数字化管理档案库。
                为了获得最佳的解谜体验，<strong>强烈建议你在手边准备一个记事本（或电子便签）</strong>，实时记录下你所观察到的每一个细微变化、编号及异常字符。在这座墓园里，记忆往往比数据更容易腐烂。
            </p>
            
            <details>
                <summary>能力评估提示（若对解析能力不自信请展开）</summary>
                <p style="margin-top: 10px; color: #856404;">
                    <strong>系统提示：</strong>本终端的部分档案显示逻辑与访问者的 <strong>San值（理智值）</strong> 挂钩。环境的异动、字符的乱码程度以及隐藏链接的出现，均受此数值波动影响。
                </p>
            </details>

            <div class="disclaimer-text">
                <strong>免责声明：</strong><br>
                本项目为虚构艺术创作，与现实机构无关。
            </div>
            
            <center><button class="start-btn" onclick="activateSystem()">开启终端</button></center>
        </div>
    </div>

    <div id="main-system">
        <div class="sidebar">
            <div style="padding: 45px 25px; text-align: center;">
                <h1 style="font-size: 22px; letter-spacing: 6px; color: var(--accent-gold); margin:0;">千安公墓</h1>
            </div>
            <div style="padding: 30px; font-size: 14px; color: var(--accent-gold);">● 档案检索模块 - 联机</div>
            <div style="margin-top: auto; padding: 30px; font-size: 11px; color: #555;">© 2026 QianAn Admin</div>
        </div>

        <div class="main-panel">
            <div class="search-card">
                <h2 style="border-left: 5px solid var(--accent-gold); padding-left: 20px;">档案检索中心</h2>
                <input type="text" id="pass" placeholder="输入索引号，如: QA-0722">
                <button id="search-btn" onclick="runSearch()">验证并检索</button>
            </div>
        </div>
    </div>

    <script>
        function activateSystem() {
            const welcome = document.getElementById('welcome-screen');
            welcome.style.opacity = '0';
            setTimeout(() => {
                welcome.style.display = 'none';
                document.getElementById('main-system').style.display = 'flex';
            }, 800);
        }

        function runSearch() {
            var input = document.getElementById('pass').value.trim().toLowerCase();
            if (input) {
                document.getElementById('search-btn').innerText = "正在同步千安数据库...";
                setTimeout(() => { window.location.href = input + ".html"; }, 1200);
            }
        }
    </script>
</body>
</html>
