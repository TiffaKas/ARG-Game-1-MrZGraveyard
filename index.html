<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问协议 - 千安公墓管理系统</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; --dark: #333; }
        body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background-color: #fff; overflow: hidden; }

        #welcome {
            height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.8s;
        }
        .box { max-width: 600px; padding: 40px; line-height: 1.8; color: var(--dark); }
        .author-note { margin: 25px 0; padding: 15px; border-left: 4px solid var(--gold); background: #f9f9f9; font-size: 14px; }
        .disclaim { font-size: 12px; color: #888; border-top: 1px solid #eee; margin-top: 20px; padding-top: 10px; }
        .btn { margin-top: 30px; padding: 15px 50px; background: var(--p-bg); color: var(--gold); border: none; cursor: pointer; font-weight: bold; width: 100%; letter-spacing: 2px; transition: 0.3s; }
        .btn:hover { background: #2c3e50; }
    </style>
</head>
<body>

    <div id="welcome">
        <div class="box">
            <h2 style="text-align:center; color:var(--p-bg); letter-spacing: 4px;">入职协议</h2>
            
            <p>你的姐姐意外去世了，家里人是这么认为，其他人这么认为，甚至你也这么认为</p>
            <p>姐姐是一名编程高手，一天你在处理她的遗物时发现，她手写了一封信——这对一个长期使用电子产品的人很奇怪：叙，去千安公墓，帮帮我......</p>
            <p>一切的一切都透露着其中有隐情，</p>于是你入职了千安公墓，接替了姐姐的岗位，找到她的意所指</p>
            <p>今天也是正常的一天，正常完成工作，正常地调查吧<p>

            <div class="author-note">
                <strong>作者的话：</strong><br>
                建议在手边准备一个记事本，记录下观察到的所有变化。在这个系统里，细节决定真相。
            </div>

            <div class="disclaim">
                <strong>免责声明：</strong> 本网站为虚构艺术作品，与现实机构无关。所有编号及记录纯属虚构。
            </div>
            
            <button class="btn" onclick="go()">开启终端</button>
        </div>
    </div>

    <script>
        function go() {
            document.getElementById('welcome').style.opacity = '0';
            setTimeout(() => {
                // 跳转至浏览器主页
                window.location.href = "summary.html";
            }, 800);
        }
    </script>
</body>
</html>
