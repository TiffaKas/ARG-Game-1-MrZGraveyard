<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>访问协议 - 千安公墓管理系统</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; --dark: #333; }
        body { margin: 0; font-family: sans-serif; background-color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .box { max-width: 600px; padding: 40px; line-height: 1.6; color: var(--dark); border: 1px solid #eee; }
        h2 { text-align: center; color: var(--p-bg); border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        .btn { margin-top: 30px; padding: 15px 50px; background: var(--p-bg); color: var(--gold); border: none; cursor: pointer; font-weight: bold; width: 100%; letter-spacing: 2px; transition: 0.3s; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="box">
        <h2>作者寄语</h2>
        <p>欢迎来到千安公墓。你将作为一名档案管理人员，负责处理日常的数字化录入工作。</p>
        <p><strong>注意：</strong>在这个系统里，细节决定真相。建议在手边准备一个记事本记录异常。</p>
        <button class="btn" onclick="window.open('system.html', '_blank')">我已阅读并知晓</button>
    </div>
</body>
</html>
