<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>千安公墓 - 档案录入</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; --dark: #333; }
        body { margin: 0; font-family: "SimSun", serif; background: #f0f2f5; display: flex; height: 100vh; }
        .main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .entry-card { background: #fff; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 4px solid var(--p-bg); }
        h2 { font-weight: normal; color: var(--dark); border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .field { margin: 20px 0; }
        label { display: block; margin-bottom: 8px; color: #666; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; box-sizing: border-box; outline: none; }
        .btn-group { margin-top: 30px; }
        #submit-btn { width: 100%; padding: 15px; background: var(--p-bg); color: var(--gold); border: none; cursor: pointer; font-weight: bold; letter-spacing: 2px; }
        #submit-btn:hover { filter: brightness(1.2); }
    </style>
</head>
<body>
    <script src="sidebar.js"></script>
    <div class="main">
        <div class="entry-card">
            <h2>新档案录入</h2>
            <div class="field">
                <label>主体姓名</label>
                <input type="text" id="target-name" placeholder="请输入姓名">
            </div>
            <div class="field">
                <label>索引编号 (自动生成)</label>
                <input type="text" id="target-index" readonly>
            </div>
            <div class="btn-group">
                <button id="submit-btn" onclick="saveRecord()">确认归档</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = () => {
            // 自动生成一个简单的索引号
            document.getElementById('target-index').value = "QA-" + Math.floor(Math.random()*9000 + 1000);
        };

        function saveRecord() {
            const name = document.getElementById('target-name').value.trim();
            if(!name) { alert("请输入姓名"); return; }

            // 1. 获取 system.html 派发的任务原文
            const originalContent = localStorage.getItem('current_task_content');
            
            if(!originalContent) {
                alert("当前无待处理任务，请返回系统页面等待。");
                return;
            }

            // 2. 构造存档对象
            const record = {
                name: name,
                index: document.getElementById('target-index').value,
                task_desc: originalContent, // 核心：保存描述
                time: new Date().toLocaleString()
            };

            // 3. 读取并更新 cemetery_files 数组
            let archives = JSON.parse(localStorage.getItem('cemetery_files') || '[]');
            archives.push(record);
            localStorage.setItem('cemetery_files', JSON.stringify(archives));

            // 4. 清除当前任务标记（触发 system.html 下一轮计时）
            localStorage.removeItem('current_task_content');

            alert("档案已入库");
            window.location.href = 'system.html';
        }
    </script>
</body>
</html>
