<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>档案录入终端 - 千安公墓</title>
    <style>
        :root { --ink: #000; --paper: #fff; --gold: #b8977e; --bg: #f0f2f5; }
        body { background: var(--bg); font-family: "SimSun", serif; padding: 40px; margin: 0; display: flex; justify-content: center; transition: background 0.1s; }
        
        /* 优化后的闪屏：中性的灰白光跳动 */
        .flash-white { animation: flash 0.2s ease-in-out; }
        @keyframes flash {
            0% { background: var(--bg); }
            50% { background: #e0e0e0; }
            100% { background: var(--bg); }
        }

        .form-container { max-width: 700px; width: 100%; background: var(--paper); padding: 50px; border: 1px solid var(--ink); position: relative; }
        h2 { text-align: center; border-bottom: 2px solid var(--ink); padding-bottom: 15px; margin-top: 0; }
        
        .field { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; box-sizing: border-box; font-family: inherit; outline: none; background: #fafafa; }
        input:focus { border-color: var(--gold); background: #fff; }

        .submit-btn { background: #1d2731; color: var(--gold); border: none; padding: 18px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px; }
        
        /* 动态提示文字样式 */
        #hint-text { 
            text-align: center; height: 20px; margin-top: 10px; 
            font-size: 14px; color: #666; font-weight: bold; 
            visibility: hidden; transition: opacity 0.2s;
        }

        /* 跨页面共享的弹窗样式 */
        .work-popup { position: fixed; bottom: 20px; right: 20px; width: 300px; background: #fff; border: 2px solid var(--gold); padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); font-size: 13px; z-index: 1000; }
        .popup-title { font-weight: bold; border-bottom: 1px solid #ddd; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>逝者数字化档案录入表</h2>
    <div id="hint-text">好像不太对</div>
    
    <div class="field">
        <label>姓氏 (Surname)</label>
        <input type="text" id="lastName" placeholder="提取附单中的核心姓氏">
    </div>
    <div class="field">
        <label>生理资料 (Biological Data)</label>
        <textarea id="bioData" rows="3" placeholder="例如：骨密度异常、虹膜异色..."></textarea>
    </div>
    <div class="field">
        <label>生平简述 (Biography)</label>
        <textarea id="desc" rows="4" placeholder="提取职业或生前习性..."></textarea>
    </div>
    <div class="field">
        <label>系统分配索引号</label>
        <input type="text" id="indexCode" readonly style="background:#eee;">
    </div>
    <button class="submit-btn" onclick="saveData()">确认提交并封存档案</button>
    <a href="system.html" style="display:block; text-align:center; margin-top:20px; color:#666; font-size:12px; text-decoration:none;">返回管理终端</a>
</div>

<script>
    // 答案关键词库
    const ANSWER_KEYS = {
        "张顺": ["骨", "灰", "虹膜", "地"],
        "林婉": ["温", "冷", "重", "铅", "关节", "硬"],
        "陈阿公": ["听", "光", "敏", "缩", "声"]
    };

    window.onload = function() {
        document.getElementById('indexCode').value = 'QA-' + Math.floor(Math.random()*8999 + 1000);
        const savedTask = localStorage.getItem('current_task_content');
        if (savedTask) {
            const popup = document.createElement('div');
            popup.className = 'work-popup';
            popup.innerHTML = `<div class="popup-title">待处理口述文本</div><div>“${savedTask}”</div>`;
            document.body.appendChild(popup);
        }
    }

    // 通用反馈函数：接收不同的文字
    function triggerFeedback(msg) {
        document.body.classList.remove('flash-white');
        void document.body.offsetWidth; 
        document.body.classList.add('flash-white');
        const hint = document.getElementById('hint-text');
        hint.innerText = msg;
        hint.style.visibility = 'visible';
        setTimeout(() => { hint.style.visibility = 'hidden'; }, 2000);
    }

    function saveData() {
        const name = document.getElementById('lastName').value.trim();
        const bio = document.getElementById('bioData').value.trim();
        const desc = document.getElementById('desc').value.trim();
        const currentTask = localStorage.getItem('current_task_content');

        // 判定 1：没有任务时的非法录入
        if (!currentTask) {
            triggerFeedback("别那么无聊");
            return;
        }

        // 判定 2：基础非空检查
        if (!name || !bio || !desc) {
            triggerFeedback("好像不太对");
            return;
        }

        // 判定 3：答案准确性校验
        const expectedKeywords = ANSWER_KEYS[name];
        if (!expectedKeywords) {
            triggerFeedback("好像不太对");
            return;
        }

        const matchCount = expectedKeywords.filter(key => bio.includes(key)).length;
        if (matchCount < 1) {
            triggerFeedback("好像不太对");
            return;
        }

        // 校验通过：保存数据
        const newFile = { id: document.getElementById('indexCode').value, name, bio, desc, time: new Date().toLocaleString() };
        let archives = JSON.parse(localStorage.getItem('cemetery_files') || '[]');
        archives.push(newFile);
        localStorage.setItem('cemetery_files', JSON.stringify(archives));

        // 重置状态
        localStorage.setItem('last_record_timestamp', Date.now());
        localStorage.removeItem('current_task_content');

        alert("录入成功。档案已封存。");
        window.location.href = 'system.html';
    }
</script>
</body>
</html>
