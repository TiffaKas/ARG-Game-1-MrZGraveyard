<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>档案录入 - 千安公墓</title>
    <style>
        body { background: #f0f2f5; font-family: "SimSun", serif; padding: 40px; display: flex; justify-content: center; }
        .form { max-width: 600px; width: 100%; background: #fff; padding: 30px; border: 1px solid #000; }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; }
        button { background: #1d2731; color: #b8977e; border: none; padding: 15px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form">
        <h2>数字化录入终端</h2>
        <div class="field">
            <label>姓名（含括号描述）</label>
            <input type="text" id="lastName" placeholder="例如：陈建">
        </div>
        <div class="field">
            <label>生理特征提取</label>
            <textarea id="bioData" rows="4"></textarea>
        </div>
        <div class="field">
            <label>生平总结</label>
            <textarea id="desc" rows="4"></textarea>
        </div>
        <button onclick="saveData()">提交并对焦档案</button>
    </div>

    <script>
        function saveData() {
            const name = document.getElementById('lastName').value.trim();
            const bio = document.getElementById('bioData').value.trim();
            if(!name || !bio) return alert("字段不能为空");

            let archives = JSON.parse(localStorage.getItem('cemetery_files') || '[]');
            archives.push({
                name: name,
                time: new Date().toLocaleString(),
                bio: bio,
                desc: document.getElementById('desc').value
            });
            localStorage.setItem('cemetery_files', JSON.stringify(archives));
            localStorage.removeItem('current_task_content');
            
            alert("档案录入成功。");
            window.open('list.html', '_blank');
        }
    </script>
</body>
</html>
