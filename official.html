<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>千安园 - 每一份生命都值得被温柔对待</title>
    <style>
        :root { --gold-light: #d4af37; --text: #4a4a4a; --bg: #ffffff; --dark-blue: #1d2731; }
        body { margin: 0; font-family: "Microsoft YaHei", "Source Han Serif CN", serif; color: var(--text); background: var(--bg); line-height: 1.8; }
        
        /* 导航栏 */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 10% ; border-bottom: 1px solid #eee; position: sticky; top: 0; background: #fff; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: var(--gold-light); letter-spacing: 2px; }
        .nav-links { display: flex; align-items: center; }
        .nav-links a { margin-left: 30px; text-decoration: none; color: #666; font-size: 14px; transition: color 0.3s; }
        .nav-links a:hover { color: var(--gold-light); }

        .login-btn { margin-left: 30px; padding: 6px 20px; border: 1px solid var(--gold-light); color: var(--gold-light); border-radius: 20px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .login-btn:hover { background: var(--gold-light); color: #fff; }

        /* 管理员浮窗 */
        .admin-float-btn { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            padding: 12px 24px; 
            background: var(--dark-blue); 
            color: var(--gold-light); 
            border: 2px solid var(--gold-light); 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            z-index: 9999; 
            display: none; 
            font-weight: bold;
            transition: all 0.3s;
        }
        .admin-float-btn:hover { transform: scale(1.05); background: #2c3e50; }

        /* 英雄区 */
        .hero { height: 60vh; background: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), url('https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 48px; color: #333; margin-bottom: 10px; font-weight: 300; }
        .hero p { font-size: 18px; letter-spacing: 5px; color: var(--gold-light); }

        /* 登录弹窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 40px; border-radius: 8px; width: 320px; position: relative; text-align: center; }
        .modal-content h2 { margin-top: 0; color: var(--dark-blue); font-size: 20px; margin-bottom: 25px; }
        .close-modal { position: absolute; top: 15px; right: 15px; cursor: pointer; color: #aaa; font-size: 20px; }
        
        .login-form input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; outline: none; }
        .submit-btn { width: 100%; padding: 12px; background: var(--dark-blue); color: var(--gold-light); border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .error-msg { color: #c0392b; font-size: 12px; margin-top: -10px; margin-bottom: 10px; display: none; }

        /* 内容板块 */
        .content-section { padding: 80px 15%; text-align: center; }
        .content-section h2 { font-size: 30px; margin-bottom: 40px; position: relative; display: inline-block; }
        .content-section h2::after { content: ''; position: absolute; bottom: -10px; left: 25%; width: 50%; height: 2px; background: var(--gold-light); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 50px; }
        .card { padding: 30px; border: 1px solid #f0f0f0; transition: transform 0.3s; background: #fafafa; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .card h3 { color: var(--gold-light); margin-bottom: 15px; }
