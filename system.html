<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>千安公墓 - 数字化管理平台</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; --dark: #333; }
        body { margin: 0; font-family: sans-serif; background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }

        /* 侧边栏优化 */
        .side { width: 260px; background: var(--p-bg); color: #fff; border-right: 4px solid var(--gold); display: flex; flex-direction: column; }
        .nav-menu { margin-top: 20px; flex: 1; }
        .menu-label { padding: 15px 25px 5px; font-size: 11px; color: #555; letter-spacing: 1px; text-transform: uppercase; }
        .nav-item { 
            padding: 12px 25px; font-size: 14px; color: var(--gold); cursor: pointer; 
            transition: all 0.3s; display: flex; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .nav-item:hover { background: rgba(255,255,255,0.1); padding-left: 30px; }
        .nav-item span { margin-right: 15px; font-size: 10px; }
        
        /* 外部显象项特殊样式 */
        .external { color: #fff; border-left: 3px solid transparent; }
        .external:hover { border-left-color: #fff; }

        /* 主界面 */
        .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; position: relative; }
        .card { background: #fff; padding: 50px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { border-left: 4px solid var(--gold); padding-left: 15px; font-weight: normal; margin-bottom: 30px; color: var(--dark); font-size: 18px; }
        input { width: 100%; padding: 15px; border: 1px solid #ddd; margin: 20px 0; box-sizing: border-box; outline: none; }
        #search-btn { width: 100%; padding: 15px; background: var(--p-bg); color: var(--gold); border: none; cursor: pointer; font-weight: bold; }

        /* 持久化弹窗 */
        .work-popup {
            position: fixed; bottom: 20px; right: 20px; 
            width: 320px; background: #fff; border: 2px solid var(--gold);
            padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 9999; font-family: "SimSun", serif;
        }
        .popup-title { border-bottom: 1px solid #000; margin: 0 0 10px 0; padding-bottom: 5px; font-weight: bold; font-size: 14px; }
        .popup-content { font-size: 13px; color: #333; line-height: 1.6; font-style: italic; background: #f9f9f9; padding: 10px; border: 1px inset #eee; }
    </style>
</head>
<body>

    <div class="side">
        <div style="padding:40px 20px; text-align:center">
            <h1 style="color:var(--gold); font-size:22px; letter-spacing:4px; margin:0">千安公墓</h1>
            <p style="font-size:10px; color:#555; margin-top:5px;">OBSERVER TERMINAL v7.0</p>
        </div>
        
        <div class="nav-menu">
            <div class="menu-label">内部管理</div>
            <div class="nav-item" onclick="window.location.href='system.html'"><span>[01]</span> 档案检索模块</div>
            <div class="nav-item" onclick="window.location.href='entry.html'"><span>[02]</span> 数据录入终端</div>
            <div class="nav-item" onclick="window.location.href='list.html'"><span>[03]</span> 已录入档案库</div>

            <div class="menu-label">外部连接</div>
            <div class="nav-item external" onclick="window.location.href='official.html'"><span>●</span> 访问对外官网</div>
            <div class="nav-item external" onclick="window.location.href='wechat.html'"><span>●</span> 移动通讯快讯</div>
            <div class="nav-item external" onclick="window.location.href='email.html'"><span>●</span> 内部行政邮箱</div>
        </div>
        
        <div style="padding:20px; font-size:11px; color:#444;">
            认知波动：<span style="color: #00ff00;">极低</span><br>
            © 2026 Q-A Admin
        </div>
    </div>

    <div class="main">
        <div class="card">
            <h2>档案索引/检索</h2>
            <input type="text" id="pass" placeholder="输入逝者姓名或索引号">
            <button id="search-btn" onclick="find()">开始校验</button>
        </div>
    </div>

    <script>
        function find() {
            var val = document.getElementById('pass').value.trim();
            if (val) {
                const btn = document.getElementById('search-btn');
                btn.innerText = "正在同步显象..."; btn.disabled = true;
                setTimeout(() => { window.location.href = val + ".html"; }, 1000);
            }
        }

        function renderPersistentPopup(content) {
            if (document.getElementById('persistent-popup')) return;
            const popup = document.createElement('div');
            popup.className = 'work-popup';
            popup.id = 'persistent-popup';
            popup.innerHTML = `
                <div class="popup-title">[ 待处理原始附单 ]</div>
                <div class="popup-content">“${content}”</div>
                <button style="width:100%; background:#1d2731; color:#b8977e; border:none; padding:12px; cursor:pointer; margin-top:15px; font-weight:bold;" onclick="window.location.href='entry.html'">进入录入终端</button>
            `;
            document.body.appendChild(popup);
        }

        window.onload = () => {
            const savedTask = localStorage.getItem('current_task_content');
            if (savedTask) renderPersistentPopup(savedTask);
        };
    </script>
</body>
</html>
