<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>千安公墓 - 数字化管理平台</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; }
        body { margin: 0; font-family: "SimSun", serif; background: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }
        .side { width: 260px; background: var(--p-bg); border-right: 4px solid var(--gold); color: #fff; }
        .nav-item { padding: 15px 25px; color: var(--gold); cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); display: block; text-decoration: none; }
        .main { flex: 1; padding: 40px; text-align: center; }
        .work-popup { position: fixed; right: 20px; bottom: 20px; width: 400px; background: #fff; border: 2px solid var(--p-bg); padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 999; text-align: left; }
        .popup-content { font-size: 13px; color: #444; line-height: 1.6; max-height: 250px; overflow-y: auto; margin: 10px 0; border: 1px inset #eee; padding: 10px; }
        .action-btn { background: var(--p-bg); color: var(--gold); border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="side">
        <div style="padding:40px 20px; font-weight:bold; color:var(--gold); font-size:22px;">千安公墓管理端</div>
        <a class="nav-item" href="system.html">档案检索首页</a>
        <a class="nav-item" href="rules.html" target="_blank">员工守则</a>
        <a class="nav-item" href="list.html" target="_blank">已录入档案库</a>
        <a class="nav-item" href="wechat.html" target="_blank">移动通讯</a>
        <a class="nav-item" href="google.html" target="_blank">内网搜索</a>
    </div>
    <div class="main">
        <h1>数字化管理平台</h1>
        <p>欢迎回来，管理员。当前系统版本：2026.04.25</p>
    </div>

    <script>
        const TASK_POOL = [
            "【附单#01】陈建（阿建）身体挺不错的，没想到在家里就这么静静地走了。不知道是什么原因？之前摔跤后没有骨折，没有扭伤，我一直都觉得阿建身体很好，没有我们这个年纪常有的骨质疏松。也经常锻炼，每天都是走两万步以上，也很鼓舞人，可惜的就是没有一个好妻子陪伴着他，也无儿无女。还记得阿建当时是镇里唯一一个考上大学的人，可风光了，他是个好人。陈建是个好人，不是说他做过舍身为人的大善事，但是他一直守着本分，不越界；每当碰见有人需要帮助时，灰色的瞳孔总是让人感到安心，大家和他相处都很舒服。致：灰色的阿建。",
            "【附单#02】果果.......是妈妈不好，要是妈妈当时没有失去理智就好了，是妈妈让你伤心了，但是孩子，这个世界太苦，你也太苦，这个石人病太折磨人了..................嗯......这对你来说也许也是一件好事。/ 宋涵是个很好的同学，她人挺高的，成绩好，是个好班长，做事认真，客观。记得那一次，我差点被冤枉了，是她坚持调查下去我才被还回清白。她正常地直呼我的大名，干练的声音和一声声“小同”始终在我的脑海。宋涵，再见，祝你好运。",
            "【附单#03】谁也没想到，老周，周诚，会在盛夏的午后，蜷缩在那个没有冷气的维修间里冻死。他走的时候，身上确实覆盖着一层薄薄的白色霜华。我一直觉得老周是个怪人，虽然他身体看起来很硬朗，从不感冒，但他那双手摸起来总是像井水一样冰凉，夏天和他握手甚至能感到一阵寒意。老周是个实实在在的好人。记得那年学校电路短路引发小火灾，是他冒着烟冲进去抢救档案。大家后来问他怕不怕烫，他只是搓了搓那双发蓝的指甲盖，憨厚地笑笑说：“我这人天生怕热不怕火。”他这辈子没结过婚，守着那堆零件过日子，从不占人便宜。医生私下里嘀咕，说老周的代谢速度慢得惊人。"
        ];

        function checkTask() {
            let archives = JSON.parse(localStorage.getItem('cemetery_files') || '[]');
            let currentTask = localStorage.getItem('current_task_content');
            
            if(!currentTask && archives.length < TASK_POOL.length) {
                localStorage.setItem('current_task_content', TASK_POOL[archives.length]);
                location.reload();
            }

            if(currentTask && !document.querySelector('.work-popup')) {
                const div = document.createElement('div');
                div.className = 'work-popup';
                div.innerHTML = `<h3>待处理原始附单</h3><div class="popup-content">${currentTask}</div>
                <button class="action-btn" onclick="window.open('entry.html', '_blank')">前往录入终端</button>`;
                document.body.appendChild(div);
            }
        }
        window.onload = checkTask;
    </script>
</body>
</html>
