<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数字化管理平台 - 千安公墓</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; --dark: #333; }
        body { margin: 0; font-family: "SimSun", serif; background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }
        .side { width: 260px; background: var(--p-bg); color: #fff; border-right: 4px solid var(--gold); display: flex; flex-direction: column; }
        .nav-item { padding: 15px 25px; color: var(--gold); cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); text-decoration: none; display: block; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .main { flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .search-container { width: 100%; max-width: 600px; text-align: center; }
        input { width: 80%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; }
        button { padding: 10px 25px; background: var(--p-bg); color: var(--gold); border: none; cursor: pointer; }
        .work-popup { position: fixed; right: 20px; bottom: 20px; width: 300px; background: #fff; border: 2px solid var(--p-bg); padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="side">
        <div style="padding:40px 20px; font-weight:bold; color:var(--gold); font-size: 20px;">QianAn Admin</div>
        <a class="nav-item" href="system.html" target="_blank">档案检索</a>
        <a class="nav-item" href="rules.html" target="_blank">工作守则</a>
        <a class="nav-item" href="list.html" target="_blank">已录入档案</a>
        <a class="nav-item" href="wechat.html" target="_blank">移动通讯</a>
    </div>
    <div class="main">
        <div class="search-container">
            <h2>档案全局检索系统</h2>
            <input type="text" placeholder="输入姓名或编号...">
            <button onclick="window.open('google.html', '_blank')">模拟互联网搜索</button>
        </div>
    </div>

    <script>
        const TASK_POOL = ["【待办任务】姓名：陈建。特征：骨密度极高，灰质化。请录入系统。"];
        window.onload = () => {
            const task = localStorage.getItem('current_task_content');
            if(!task && !localStorage.getItem('cemetery_files')) {
                localStorage.setItem('current_task_content', TASK_POOL[0]);
                location.reload();
            }
            if(task) {
                const div = document.createElement('div');
                div.className = 'work-popup';
                div.innerHTML = `<h3>原始附单已送达</h3><p>${task}</p>
                <button style="width:100%" onclick="window.open('entry.html', '_blank')">前往录入</button>`;
                document.body.appendChild(div);
            }
        };
    </script>
</body>
</html>
