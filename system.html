<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千安公墓 - 数字化管理平台</title>
    <style>
        :root { --p-bg: #1d2731; --gold: #b8977e; --dark: #333; }
        body { margin: 0; font-family: sans-serif; background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }

        /* 侧边栏 */
        .side { width: 260px; background: var(--p-bg); color: #fff; border-right: 4px solid var(--gold); display: flex; flex-direction: column; }
        .nav-menu { margin-top: 20px; flex: 1; }
        .nav-item { 
            padding: 15px 25px; font-size: 14px; color: var(--gold); cursor: pointer; 
            transition: background 0.3s; display: flex; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item span { margin-right: 15px; width: 10px; }

        /* 主界面 */
        .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .card { background: #fff; padding: 50px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { border-left: 4px solid var(--gold); padding-left: 15px; font-weight: normal; margin-bottom: 30px; color: var(--dark); }
        input { width: 100%; padding: 15px; border: 1px solid #ddd; margin: 20px 0; box-sizing: border-box; font-size: 16px; outline: none; }
        #search-btn { width: 100%; padding: 15px; background: var(--p-bg); color: var(--gold); border: none; cursor: pointer; font-weight: bold; letter-spacing: 2px; }

        /* 工作弹窗 */
        .work-popup {
            position: fixed; bottom: 20px; right: 20px; 
            width: 300px; background: #fff; border: 1px solid #000;
            padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 9999; animation: slideIn 0.5s ease-out;
            font-family: "SimSun", serif;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .popup-title { border-bottom: 1px solid #000; margin: 0 0 15px 0; padding-bottom: 5px; font-size: 16px; font-weight: bold; }
        .popup-btn { width: 100%; background: #1d2731; color: var(--gold); border: none; padding: 12px; cursor: pointer; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="side">
        <div style="padding:40px 20px; text-align:center">
            <h1 style="color:var(--gold); font-size:22px; letter-spacing:4px; margin:0">千安公墓</h1>
        </div>
        <div class="nav-menu">
            <div class="nav-item" onclick="window.location.href='system.html'" style="background: rgba(255,255,255,0.1);">
                <span>-</span> 档案检索模块
            </div>
            <div class="nav-item" onclick="window.location.href='entry.html'">
                <span>-</span> 数据录入终端
            </div>
            <div class="nav-item" onclick="window.location.href='list.html'">
                <span>-</span> 已录入档案库
            </div>
            <div class="nav-item" onclick="window.location.href='rules.html'">
                <span>-</span> 员工守则
            </div>
        </div>
        <div style="padding:20px; font-size:11px; color:#555">© 2026 QianAn Admin System</div>
    </div>

    <div class="main">
        <div class="card">
            <h2>档案检索中心</h2>
            <input type="text" id="pass" placeholder="输入索引号或关键词">
            <button id="search-btn" onclick="find()">验证并检索</button>
        </div>
    </div>

    <script>
        // 1. 官方档案名单池（用于审计）
        // 之后我会根据你传给我的信息更新这里
        const OFFICIAL_NAMES = ["张顺", "王利民", "李陈氏"]; 

        // 2. 核心检索逻辑
        function find() {
            var val = document.getElementById('pass').value.trim().toLowerCase();
            if (val) {
                const btn = document.getElementById('search-btn');
                btn.innerText = "正在验证权限...";
                btn.disabled = true;
                setTimeout(() => { window.location.href = val + ".html"; }, 1000);
            }
        }

        // 3. 自动弹窗逻辑 (每 3 分钟)
        const WORK_INTERVAL = 180000; 
        function initWorkSystem() {
            setInterval(() => {
                if (!document.querySelector('.work-popup')) createPopup();
            }, WORK_INTERVAL);
        }

        function createPopup() {
            const popup = document.createElement('div');
            popup.className = 'work-popup';
            // 随机抽取一个官方名字作为提示（示意）
            const hintName = OFFICIAL_NAMES[Math.floor(Math.random() * OFFICIAL_NAMES.length)];
            popup.innerHTML = `
                <div class="popup-title">工作指令：待处理</div>
                <p style="font-size:13px; line-height:1.6; margin:0;">检测到逝者 [ ${hintName} ] 的纸质档案待数字化。请立即录入。非官方名单内容将在审计中被抹除。</p>
                <button class="popup-btn" onclick="window.location.href='entry.html'">进入录入程序</button>
            `;
            document.body.appendChild(popup);
        }

        // 4. 审计与清理逻辑 (每 12 分钟)
        const AUDIT_INTERVAL = 720000; 
        function startAudit() {
            setInterval(() => {
                console.log("正在执行每 12 分钟一次的档案审计...");
                let archives = JSON.parse(localStorage.getItem('cemetery_files') || '[]');
                
                // 过滤：只保留名字在官方名单池中的档案
                const filteredArchives = archives.filter(item => OFFICIAL_NAMES.includes(item.name));
                
                if (archives.length !== filteredArchives.length) {
                    localStorage.setItem('cemetery_files', JSON.stringify(filteredArchives));
                    console.warn("审计完毕：检测到非法录入项，已强制抹除。");
                }
            }, AUDIT_INTERVAL);
        }

        window.onload = () => {
            initWorkSystem();
            startAudit();
            console.log("监控审计系统已上线。");
        };
    </script>
</body>
</html>
