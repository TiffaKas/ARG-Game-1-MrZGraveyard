<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google - 搜索中心</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            background: #fff;
        }

        /* 顶部导航占位 */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 15px 20px;
            box-sizing: border-box;
            gap: 15px;
            font-size: 13px;
        }
        .top-nav a { text-decoration: none; color: #000; }
        .top-nav a:hover { text-decoration: underline; }

        /* 中心区域 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: -100px; /* 略微上移，符合原版比例 */
        }

        /* 伪Google Logo */
        .logo {
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 30px;
            user-select: none;
        }
        .logo span:nth-child(1) { color: #4285F4; } /* G */
        .logo span:nth-child(2) { color: #EA4335; } /* o */
        .logo span:nth-child(3) { color: #FBBC05; } /* o */
        .logo span:nth-child(4) { color: #4285F4; } /* g */
        .logo span:nth-child(5) { color: #34A853; } /* l */
        .logo span:nth-child(6) { color: #EA4335; } /* e */

        /* 搜索框 */
        .search-container {
            width: 100%;
            max-width: 584px;
            position: relative;
        }
        .search-bar {
            width: 100%;
            height: 44px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 50px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            transition: box-shadow 0.2s;
        }
        .search-bar:hover, .search-bar:focus{
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        /* 快捷方式图标区域 */
        .shortcuts {
            margin-top: 25px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            width: 84px;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .shortcut-item:hover {
            background: #f1f3f4;
        }
        .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f1f3f4;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 20px;
            color: #5f6368;
            font-weight: bold;
        }
        .item-label {
            font-size: 12px;
            color: #3c4043;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* 底部 */
        .footer {
            width: 100%;
            background: #f2f2f2;
            color: #70757a;
            font-size: 14px;
        }
        .footer-row {
            padding: 15px 30px;
            border-top: 1px solid #dadce0;
            display: flex;
            gap: 25px;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="#">Gmail</a>
        <a href="#">图片</a>
        <div style="background:#5f6368; width:32px; height:32px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer">Y</div>
    </div>

    <div class="main-content">
        <div class="logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>

        <div class="search-container">
            <!-- 添加了 id="searchInput" 用于 JS 监听 -->
            <input type="text" id="searchInput" class="search-bar" placeholder="搜索 Google 或输入网址" autocomplete="off">
        </div>

        <div class="shortcuts">
            <a href="wechat.html" class="shortcut-item">
                <div class="icon-circle" style="background:#07C160; color:#fff">通</div>
                <div class="item-label">移动通讯</div>
            </a>
            
            <a href="system.html" class="shortcut-item">
                <div class="icon-circle" style="background:#1d2731; color:#b8977e">千</div>
                <div class="item-label">千安管理终端</div>
            </a>

            <a href="entry.html" class="shortcut-item">
                <div class="icon-circle">＋</div>
                <div class="item-label">添加快捷方式</div>
            </a>
        </div>
    </div>

    <div class="footer">
        <div class="footer-row" style="color:rgba(0,0,0,.54)">中国</div>
        <div class="footer-row" style="justify-content: space-between;">
            <div style="display:flex; gap:25px">
                <a href="#" style="text-decoration:none; color:inherit">广告</a>
                <a href="#" style="text-decoration:none; color:inherit">商业</a>
                <a href="#" style="text-decoration:none; color:inherit">搜索的工作原理</a>
            </div>
            <div style="display:flex; gap:25px">
                <a href="#" style="text-decoration:none; color:inherit">隐私政策</a>
                <a href="#" style="text-decoration:none; color:inherit">条款</a>
                <a href="#" style="text-decoration:none; color:inherit">设置</a>
            </div>
        </div>
    </div>

    <!-- JavaScript 逻辑 -->
    <script>
        const searchInput = document.getElementById('searchInput');

        // 监听键盘事件
        searchInput.addEventListener('keydown', function(event) {
            // 当按下回车键时
            if (event.key === 'Enter') {
                const query = searchInput.value.trim();

                // 核心逻辑：如果输入包含“马小同”，跳转到对应的搜索结果页
                if (query.includes('马小同')) {
                    window.location.href = 'search_results_ma.html';
                } 
                else if (query.includes('石人病')) {
                    window.location.href = 'search_results_ma.html';
                }
                else{
                    console.log("用户搜索了未知内容: " + query);
            }});
    </script>

</body>
</html>
